# ФАЙЛ СОБРАН tests/corpus_v2/assemble_types.py — НЕ ПРАВИТЬ РУКАМИ:
# правку сотрёт следующая сборка. Источники: entity_types.base.yaml
# (непереведённые типы, текст дословно) + tests/corpus_v2/typedefs/*.yaml
# (фабричные типы). Сверка: assemble_types.py --check; страж —
# tests/test_type_factory.py.
# Этап 1b — политика непрочитанных зон .docx (колонтитулы, сноски, надписи,
# вложенные таблицы). true (умолчание, fail-closed): encrypt ОТКАЗЫВАЕТСЯ работать
# с документом, часть текста которого система прочитать не умеет — молчаливая
# потеря куска договора опаснее, чем отказ. false: работать, но громко предупредить
# и записать текст зон в {session_id}.unread.json (то же, что флаг --allow-lossy).
# Читается только блоком 7 (shifrator.py); детекторы этот ключ игнорируют.
strict_zones: true

entity_types:
  # ЭТАП B (structure-first PER). Natasha-PER на прозе ВЫКЛЮЧЕНА (убран ner_label,
  # как ORG на этапе A): NER-тэггер рвал косвенный падеж на два спана (PER-B) и давал
  # ложные PER на родовых словах (Участник→PERSON). ФИО теперь даёт ТОЛЬКО
  # src/anchor_registry.py (PerAnchorDetector: якорь по форме ФИО/должности/«в лице»/
  # «гражданин»/ИНН-12/СНИЛС + проход 2 по лемме ФАМИЛИИ, косвенный падеж одним
  # спаном). Безъякорная одиночная фамилия сознательно пропускается (класс Aprime-1).
  # token_prefix оставлен — тип по-прежнему токенизируется.
  PERSON:
    method: anchor_registry
    anchor_type: PER
    token_prefix: PERSON
    # Вхождение в наборы type_policy (этап TYPE-FACTORY шаг 2);
    # «Максимум» — сентинел, не перечисляется.
    sets: [personal, personal_requisites, with_money]
  # ЭТАП A (structure-first ORG). Natasha-ORG на прозе ВЫКЛЮЧЕНА: убран ner_label,
  # поэтому _load_ner_config не кладёт ORG в ner_label_map — NER-тэггер ORG больше
  # не даёт (он метил юр-мусор: Большинство→ORG, а одно имя фирмы в падежах — разные
  # типы, см. archive/reports/HANDOFF_A0_GLINER.md). ORG теперь даёт ТОЛЬКО
  # src/anchor_registry.py (якорь по org-форме/кавычкам/введению/ИНН-ОГРН юрлица +
  # проход 2 по лемме ядра). token_prefix оставлен — тип по-прежнему токенизируется.
  ORG:
    method: anchor_registry
    anchor_type: ORG
    token_prefix: ORG
    # Вхождение в наборы type_policy (этап TYPE-FACTORY шаг 2);
    # «Максимум» — сентинел, не перечисляется.
    sets: [personal_requisites, with_money]
  ADDRESS:
    method: ner
    ner_extractor: addr        # НЕ ner_label/LOC — см. требования Блока 3: используется natasha.AddrExtractor, а не NER-тэггер
    token_prefix: ADDRESS
    # Вхождение в наборы type_policy (этап TYPE-FACTORY шаг 2);
    # «Максимум» — сентинел, не перечисляется.
    sets: [personal, personal_requisites, with_money]
  # B2-fix: реквизиты (счёт/ИНН/…) в договорах РФ почти всегда группируют пробелами
  # ("40702 810 4 0000 1234567", "7707 083893"). Раньше \b\d{N}\b требовал слитных
  # цифр — сгруппированный реквизит утекал в открытом виде. Теперь между цифрами
  # допускается ОДИН разделитель — обычный пробел или неразрывный ( ), тот же класс
  # [ ], что и у SUM (не \s, чтобы не сшивать значения через перенос строки). Разделитель
  # одиночный ([ ]?), длинные пробельные пропуски не сшиваются. Про отсутствие чек-суммы
  # у KPP/ACCOUNT/BIK и связанный компромисс ложных срабатываний — см. комментарий у KPP.
  #
  # ЭТАП 4 — `validate:` больше не шлагбаум сам по себе: `anchor:` (см.
  # src/regex_detector.py `_has_anchor`) даёт вторую, независимую от КС дорогу к
  # маскировке. Под якорем слева («ИНН»/«ОГРН» и т.п., окно _ANCHOR_WINDOW, не
  # пересекает \n) значение маскируется ДАЖЕ ЕСЛИ КС не сошлась — опечатка в ПДн не
  # делает номер не-ПДн (STATE §6, инвариант этапа 4). Без якоря КС остаётся
  # фильтром: голое число без «ИНН»/«ОГРН» рядом и с невалидной КС — вероятно не
  # реквизит, не берём (защита от FP на прозе/номерах пунктов).
  # ЭТАП T2-INN — ДВА ТИПА ИНН вместо одного. Разделение не техническое, а
  # смысловое: ИНН из 10 цифр принадлежит ОРГАНИЗАЦИИ и персональными данными не
  # является; ИНН из 12 цифр принадлежит ЧЕЛОВЕКУ (физлицу/ИП) и персональными
  # данными является. Пока это был один тип, набор «только персональные данные»
  # был вынужден исключать ИНН ЦЕЛИКОМ (включить его значило бы маскировать и
  # организации) — то есть ИНН предпринимателя по умолчанию оставался открытым.
  # Имя INN сохранено ЗА ОРГАНИЗАЦИЕЙ намеренно: записи эталона с 10 цифрами и
  # история цифр по ним не двигаются вовсе, движется только 12-значная половина.
  #
  # Паттерны РАЗДЕЛЕНЫ ПО ДЛИНЕ и взаимно исключающи: \b на обоих концах не даёт
  # 10-значному паттерну откусить голову 12-значного числа. Объединение двух
  # паттернов посимвольно равно прежнему одному (тот же класс разделителей [ ]
  # B2-fix, те же 10 или 12 цифр) — множество найденных спанов не меняется,
  # меняется только тип и токен.
  # ЭТАП A7 — АНТИ-ЯКОРЬ ЧУЖИХ НОМЕНКЛАТУР (долги Stage4-C, A3-NEG-OGRN,
  # A5-INN-KBK-FP). Контрольная сумма как ЕДИНСТВЕННОЕ основание ненадёжна по
  # арифметике, а не по реализации: на произвольном числе нужной длины она
  # сходится с вероятностью 1/10 (ИНН-10), 1/11 (ОГРН-13), 1/13 (ОГРНИП-15) —
  # замерено, а не выведено (штрихкод EAN-13: 18 из 138; ОКПО: 19 из 138).
  # Ограничителей поставлено ДВА, и оба не трогают якорную дорогу:
  # * здесь — имя ЧУЖОЙ НОМЕНКЛАТУРЫ рядом (штрихкод/ОКПО/КБК/ОКТМО/…);
  # это не список конкретных негативов, а класс: число, ВВЕДЁННОЕ именем
  # другой системы учёта, реквизитом стороны не является ни при какой КС;
  # * в src/regex_detector.py — `_digit_run_neighbour`: значение, вырезанное
  # из более длинного прогона цифр, КС не подтверждается.
  # Анти-якорь действует ТОЛЬКО на значение без якоря (см. detect_regex): под
  # словом «ИНН»/«ОГРН» инвариант этапа 4 сильнее — там КС уже не решает.
  # [собрано фабрикой из tests/corpus_v2/typedefs/INN.yaml — правки только там]
  INN:
    method: regex
    pattern: '\b\d(?:[  ]?\d){9}\b'
    validate: 'inn10_checksum'
    anchor: '(?i)инн'
    anti_anchor: '(?i)\bштрих\s*-?\s*код\w*|\bean\b|\bокпо\b|\bоктмо\b|\bокато\b|\bоквэд\b|\bокуд\b|\bкбк\b|код\w*\s+бюджетн\w*|\bинвентарн\w*|\bартикул\w*|\bуин\b'
    token_prefix: 'INN'
    sets: [personal_requisites, with_money]
    measure: {leak_class: numeric}
  # ИНН ФИЗИЧЕСКОГО ЛИЦА (12 цифр). Своя контрольная сумма: у 10- и 12-значного
  # ИНН РАЗНЫЕ алгоритмы (10 — одно контрольное число, 12 — два), и валидатор
  # здесь прибит к длине, чтобы ослабление паттерна в будущем не привело к
  # проверке чужим алгоритмом. Роль КС — та же, что у INN/OGRN с этапа 4:
  # под якорем «ИНН» она СИГНАЛ (значение с не сошедшейся КС всё равно ПДн и
  # маскируется), без якоря — фильтр.
  # ЭТАП A7 — АНТИ-ЯКОРЬ ЧУЖИХ НОМЕНКЛАТУР (долги Stage4-C, A3-NEG-OGRN,
  # A5-INN-KBK-FP). Контрольная сумма как ЕДИНСТВЕННОЕ основание ненадёжна по
  # арифметике, а не по реализации: на произвольном числе нужной длины она
  # сходится с вероятностью 1/10 (ИНН-10), 1/11 (ОГРН-13), 1/13 (ОГРНИП-15) —
  # замерено, а не выведено (штрихкод EAN-13: 18 из 138; ОКПО: 19 из 138).
  # Ограничителей поставлено ДВА, и оба не трогают якорную дорогу:
  # * здесь — имя ЧУЖОЙ НОМЕНКЛАТУРЫ рядом (штрихкод/ОКПО/КБК/ОКТМО/…);
  # это не список конкретных негативов, а класс: число, ВВЕДЁННОЕ именем
  # другой системы учёта, реквизитом стороны не является ни при какой КС;
  # * в src/regex_detector.py — `_digit_run_neighbour`: значение, вырезанное
  # из более длинного прогона цифр, КС не подтверждается.
  # Анти-якорь действует ТОЛЬКО на значение без якоря (см. detect_regex): под
  # словом «ИНН»/«ОГРН» инвариант этапа 4 сильнее — там КС уже не решает.
  # [собрано фабрикой из tests/corpus_v2/typedefs/INN_PERSON.yaml — правки только там]
  INN_PERSON:
    method: regex
    pattern: '\b\d(?:[  ]?\d){11}\b'
    validate: 'inn12_checksum'
    anchor: '(?i)инн'
    anti_anchor: '(?i)\bштрих\s*-?\s*код\w*|\bean\b|\bокпо\b|\bоктмо\b|\bокато\b|\bоквэд\b|\bокуд\b|\bкбк\b|код\w*\s+бюджетн\w*|\bинвентарн\w*|\bартикул\w*|\bуин\b'
    token_prefix: 'INN_PER'
    sets: [personal, personal_requisites, with_money]
    measure: {leak_class: numeric}
  # ЭТАП A7 — АНТИ-ЯКОРЬ ЧУЖИХ НОМЕНКЛАТУР (долги Stage4-C, A3-NEG-OGRN,
  # A5-INN-KBK-FP). Контрольная сумма как ЕДИНСТВЕННОЕ основание ненадёжна по
  # арифметике, а не по реализации: на произвольном числе нужной длины она
  # сходится с вероятностью 1/10 (ИНН-10), 1/11 (ОГРН-13), 1/13 (ОГРНИП-15) —
  # замерено, а не выведено (штрихкод EAN-13: 18 из 138; ОКПО: 19 из 138).
  # Ограничителей поставлено ДВА, и оба не трогают якорную дорогу:
  # * здесь — имя ЧУЖОЙ НОМЕНКЛАТУРЫ рядом (штрихкод/ОКПО/КБК/ОКТМО/…);
  # это не список конкретных негативов, а класс: число, ВВЕДЁННОЕ именем
  # другой системы учёта, реквизитом стороны не является ни при какой КС;
  # * в src/regex_detector.py — `_digit_run_neighbour`: значение, вырезанное
  # из более длинного прогона цифр, КС не подтверждается.
  # Анти-якорь действует ТОЛЬКО на значение без якоря (см. detect_regex): под
  # словом «ИНН»/«ОГРН» инвариант этапа 4 сильнее — там КС уже не решает.
  # [собрано фабрикой из tests/corpus_v2/typedefs/OGRN.yaml — правки только там]
  OGRN:
    method: regex
    pattern: '\b\d(?:[  ]?\d){12}(?:(?:[  ]?\d){2})?\b'
    validate: 'ogrn_checksum'
    anchor: '(?i)огрн'
    anti_anchor: '(?i)\bштрих\s*-?\s*код\w*|\bean\b|\bокпо\b|\bоктмо\b|\bокато\b|\bоквэд\b|\bокуд\b|\bкбк\b|код\w*\s+бюджетн\w*|\bинвентарн\w*|\bартикул\w*|\bуин\b'
    token_prefix: 'OGRN'
    sets: [personal_requisites, with_money]
    measure: {leak_class: numeric}
  # KPP/BIK не имеют контрольной суммы (у КПП её не существует — известное
  # ограничение MVP). С разрешёнными разделителями KPP теперь может поймать и "лишнее":
  # последовательность из 9 цифр-токенов через пробел (нумерованный список "1 2 3 … 9")
  # совпадёт с KPP. Осознанный компромисс: для инструмента-редактора ПДн перетокенизировать
  # безобидный список цифр — БЕЗОПАСНОЕ направление ошибки, а вот НЕ поймать реквизит —
  # это утечка (ровно та, что чинит B2). Группы НЕ ограничиваем по числу: счёт, разбитый
  # по 3 цифры (407 028 104 …), даёт 7 групп — жёсткий лимит вернул бы утечку.
  # BIK(04+7 цифр) достаточно специфичен, чтобы случайные пробельные совпадения в прозе
  # были пренебрежимо редки; INN/OGRN дополнительно закрыты чек-суммой (теперь — сигналом,
  # см. выше). У BANK_ACCOUNT нет своей КС в этом MVP (вычисление настоящего банковского
  # ключа требует БИК рядом — вне охвата этапа 4), поэтому без `validate:` единственная
  # защита от FP (этап 3: КБК/20-значные бюджетные коды матчили как ACCOUNT) — `anchor:`:
  # без «р/с»/«к/с»/«счёт» рядом слева голое 20-значное число НЕ берётся вообще (нет ни
  # КС, ни якоря — подтвердить нечем).
  # ЭТАП A4 — якорь по образцу ИНН/ОГРН. Было: любое девятизначное число
  # маскировалось безусловно (см. комментарий выше, класс SNILS/BIRTHDATE/…) —
  # на реальном договоре без единого слова «КПП» это дало 10 ложных из 10
  # (A3, любой девятизначный номер пункта/суммы/телефона брался как КПП). Теперь
  # `anchor:` требует слово-якорь СЛЕВА (см. `_has_anchor`, окно 40 знаков, не
  # пересекает \n и цифру) — без validate этот якорь не сигнал, а ШЛАГБАУМ
  # (см. detect_regex: validator is None and not anchored -> continue): без
  # «КПП» рядом число не берётся вовсе.
  # Второй pattern — связка «ИНН/КПП <10 цифр>/<9 цифр>»: между словом «КПП» и
  # ВТОРЫМ (искомым) числом стоит ПЕРВОЕ число (сам ИНН), а `_has_anchor` не
  # пересекает цифру — окно якоря обрубается на ИНН, «КПП» в него не попадает,
  # и общий якорный pattern такую запись НЕ поймал бы (риск, названный owner).
  # Отдельная запись матчит связку целиком и берёт span_group=1 (второе число).
  # [собрано фабрикой из tests/corpus_v2/typedefs/KPP.yaml — правки только там]
  KPP:
    method: regex
    patterns:
      - pattern: '\b\d(?:[  ]?\d){8}\b'
        anchor: '(?i)кпп'
      - pattern: '(?i)инн\s*/\s*кпп[^\n\d]{0,15}\d(?:[  ]?\d){9}\s*/\s*(\d(?:[  ]?\d){8})\b'
        span_group: 1
    token_prefix: 'KPP'
    sets: [personal_requisites, with_money]
    measure: {leak_class: numeric}
  # [собрано фабрикой из tests/corpus_v2/typedefs/BANK_ACCOUNT.yaml — правки только там]
  BANK_ACCOUNT:
    method: regex
    pattern: '\b\d(?:[  ]?\d){19}\b'
    anchor: '(?i)(?:р\s*/\s*с|к\s*/\s*с|расч[её]тн\w*\s+сч[её]т\w*|лицев\w*\s+сч[её]т\w*|корреспондентск\w*\s+сч[её]т\w*|банковск\w*\s+сч[её]т\w*|сч[её]т\w*)'
    token_prefix: 'ACCOUNT'
    sets: [personal_requisites, with_money]
    measure: {leak_class: numeric}
  # ЭТАП NEG — ЯКОРЬ ТАМ, ГДЕ ЕГО НЕ БЫЛО (приём этапа A4, тип KPP).
  # Комментарий выше утверждал, что «BIK(04+7 цифр) достаточно специфичен, чтобы
  # случайные совпадения были пренебрежимо редки». Этап A3 дал против этого одно
  # число (инвентарный номер, 138 из 138), но за ним стоял ОДИН придуманный вид
  # случая. Этап NEG завёл ПЯТЬ РАЗНЫХ видов: номер товарной накладной ТОРГ-12,
  # каталожный номер позиции, заводской номер агрегата, код цели расходования
  # средств в ссылке на приказ, номер заявки. Все пять дали 138 из 138 — 690
  # ложных масок из 690 возможных. Утверждение о «пренебрежимо редких
  # совпадениях» опровергнуто не одним случаем, а классом: у типа нет НИ ЯКОРЯ,
  # НИ КОНТРОЛЬНОЙ СУММЫ, подтвердить догадку ему нечем, и любые девять цифр,
  # начатые «04», он берёт.
  #
  # Без `validate:` якорь здесь — ШЛАГБАУМ, а не сигнал (см. detect_regex:
  # `validator is None and not anchored -> continue`), ровно как у KPP после A4.
  # ЦЕНА НАЗВАНА ЗАРАНЕЕ: БИК без слова «БИК» рядом маскироваться перестаёт.
  # Обратную сторону держит негатив `bik/anchor-other` («БИК не указан, номер
  # заявки — 04…»): под якорем безосновательное число снова становится маской,
  # и это остаток класса, а не победа над ним.
  # [собрано фабрикой из tests/corpus_v2/typedefs/BIK.yaml — правки только там]
  BIK:
    method: regex
    pattern: '\b0[  ]?4(?:[  ]?\d){7}\b'
    anchor: '(?i)\bбик\b'
    token_prefix: 'BIK'
    sets: [personal_requisites, with_money]
    measure: {leak_class: numeric}
  # У паспортной сущности корпуса ДВЕ непохожих формы записи, обе имеют тип gold
  # PASSPORT: «серия+номер» и «код подразделения» (ддд-ддд). Поэтому список patterns.
  # серия+номер. Спан исторически = весь матч (вместе со словом «паспорт») —
  # это известный дефект границ 0c-B, он НЕ чинится этапом 3 (чужая правка),
  # поведение оставлено байт-в-байт прежним.
  # ЭТАП A1 — расширение по факту реального договора (DOG-PASSPORT-GAP):
  # зазор якорь->серия был [^\n\d]{0,20}, фактически формулировка «паспорт»
  # (не «серия») кладёт серию на 21-22 символа дальше — поднято до {0,40} с
  # запасом сверх измеренного максимума, но не безгранично (якорь должен
  # остаться якорем, а не «любые 10 цифр рядом со словом»). Разделитель
  # серия->номер был только «\s?» (один необязательный пробел), реальный
  # документ ставит «, №» и « №» — добавлены запятая/неразрывный
  # пробел/маркер «№» как ОПЦИОНАЛЬНЫЕ элементы, каждый бинарный, поэтому
  # старое поведение (пустой разделитель или один пробел) не меняется.
  # ЭТАП 3 — код подразделения. Голый «ддд-ддд» брать НЕЛЬЗЯ: это кусок телефона,
  # индекса, чего угодно. Берём ТОЛЬКО под якорем «код подразделения», а
  # маскируем span_group=1 — само значение, без якоря.
  # Форма значения: нормализация этапа 2 схлопывает дефис между цифрами
  # («275-592» -> «275592»), поэтому дефис/пробел здесь опциональны.
  # ЭТАП A2 — тот же класс жёсткого гэпа, что был у серии+номера до A1
  # (A1-RIGID-GAP-SURVEY): зазор {0,10} -> {0,25} (запас под «код
  # подразделения, выдавшего паспорт: » — 21 символ, плюс небольшой
  # резерв). Разделитель `[- ]?` НЕ расширен на `\s?` — см. комментарий у
  # СНИЛС ниже (A2-NEWLINE-CROSS). ПОПУТНО ПОЧИНЕНО: комментарий выше давно
  # заявлял поддержку усечения «код подр.», но якорь требовал полное слово
  # «подраздел[а-я]*» — «код подр. 770-123» не находился НИКОГДА (проверено
  # прогоном до правки); якорь исправлен на `(?:подраздел[а-я]*|подр)\.?`.
  # [собрано фабрикой из tests/corpus_v2/typedefs/PASSPORT.yaml — правки только там]
  PASSPORT:
    method: regex
    patterns:
      - pattern: '(?i)(?:паспорт|серия)[^\n\d]{0,40}(\d{2}\s?\d{2})[  ,]{0,2}№?\.?[  ]{0,2}(\d{6})\b'
        anti_anchor: '(?i)качеств\w*|издели\w*|объект\w*|сделк\w*|трансп\w*\s*средств\w*|самоходн\w*|техническ\w*|груз\w*|товар\w*|оборудован\w*|безопасност\w*|помещени\w*|проект\w*|здани\w*|сооружени\w*'
      - pattern: '(?i)код\s*(?:подраздел[а-я]*|подр)\.?[^\n\d]{0,25}(\d{3}[- ]?\d{3})(?!\d)'
        span_group: 1
    token_prefix: 'PASSPORT'
    sets: [personal, personal_requisites, with_money]
    measure: {leak_class: numeric}
  # без контекстного якоря ("паспорт"/"серия") этот паттерн матчил бы любое 10-значное число —
  # у паспортных данных нет контрольной суммы, поэтому единственная защита от ложных срабатываний — якорь по контексту
  # ЭТАП 3 — СНИЛС. Форма ddd-ddd-ddd dd; после нормализации этапа 2 разделители
  # между цифрами схлопнуты, поэтому они опциональны. Детекция ПО ЯКОРЮ «СНИЛС»,
  # маскируется span_group=1 (значение без якоря).
  # ЧЕК-СУММА НАМЕРЕННО НЕ ВЕШАЕТСЯ как validate. У СНИЛС она есть, но инвариант
  # этапа 4 (STATE §4): номер с не сошедшейся КС — ВСЁ РАВНО ПДн, отбраковка = утечка.
  # В корпусе есть SNILS с checksum:invalid, и они обязаны маскироваться. Якорь
  # «СНИЛС» + форма — достаточное и не отбраковывающее основание; validate: здесь
  # означало бы «увидели и выбросили», т.е. заранее воспроизвело бы дыру этапа 4.
  # ЭТАП A2 — тот же класс, что был у паспорта до A1 (A1-RIGID-GAP-SURVEY):
  # официальное название документа длиннее, чем «страховое свидетельство» —
  # практика оформления пишет «...государственного/обязательного пенсионного
  # страхования» между якорем и номером; это добавлено В ЯКОРЬ (опционально),
  # а не в зазор — иначе якорь перестал бы быть якорем на 50+ символов.
  # Зазор {0,20} -> {0,30} (остаток — «(СНИЛС) № », «: » и т.п.); разделитель
  # групп цифр `[- ]?` НЕ трогаем на bare `\s?` — попытка дала регресс
  # BIRTHDATE (см. комментарий там, A2-NEWLINE-CROSS): `\s` матчит и
  # ПАРАГРАФНЫЙ перенос, который в тексте документа — не пробел внутри
  # значения, а граница сегмента/ячейки; итог — разорванный частичный матч
  # вместо чистого пропуска. Оставлено дефис/пробел, как было.
  # [собрано фабрикой из tests/corpus_v2/typedefs/SNILS.yaml — правки только там]
  SNILS:
    method: regex
    pattern: '(?i)(?:снилс|страхов\w*\s+свидетельств\w*(?:\s+(?:государственного|обязательного)\s+пенсионного\s+страхования)?)[^\n\d]{0,30}(\d{3}[- ]?\d{3}[- ]?\d{3}[- ]?\d{2})(?!\d)'
    span_group: 1
    token_prefix: 'SNILS'
    sets: [personal, personal_requisites, with_money]
    measure: {leak_class: numeric}
  # ЭТАП 3 — дата рождения. НЕ детектор дат: договор состоит из дат (подписания,
  # выдачи, сроков), общий детектор дат обвалил бы precision. Дата рождения — это
  # ДАТА ПОД ЯКОРЕМ РОЖДЕНИЯ. Дата без такого якоря НЕ БЕРЁТСЯ (оставляем человеку).
  # Форма в корпусе — только DD.MM.YYYY (проверено на этапе 0b-fix); одиночный пробел
  # внутри года допускается (мутация digit_spaces его не схлопывает: нормализация
  # схлопывает разделители лишь при дефисе или прогоне >=2).
  # якорь СЛЕВА: «Дата рождения: 21.01.1960», «года рождения», усечения «рожд.»
  # ЭТАП A2 — тот же класс, что был у паспорта до A1: зазор {0,10} -> {0,35}
  # (запас под «Дата рождения (согласно паспортным данным): » — 31 символ,
  # плюс небольшой резерв). Разделитель день/месяц/год `[.\/]` -> `[.\/-]`:
  # дефис добавлен для полноты класса, но нормализация схлопывает дефис
  # МЕЖДУ ЦИФРАМИ до детекции (см. комментарий у кода подразделения выше,
  # «275-592» -> «275592») — «21-01-1980» доходит до этого паттерна уже
  # как «21011980», и с дефисом или без он не матчится (не входит в
  # текущий класс форм; фиксируется находкой A2-BIRTHDATE-HYPHEN-DEAD).
  # Пробел внутри года `[ ]?` оставлен БЕЗ ИЗМЕНЕНИЙ (не расширен до `\s?`):
  # первая попытка (`\s?`) дала регресс на корпусе v1 — 4 документа мутации
  # linebreak, где НАСТОЯЩИЙ параграфный перенос внутри значения (гэп
  # `[^\n\d]` его не пропускал бы, а внутренний разделитель года — пропустил)
  # даёт разорванный ЧАСТИЧНЫЙ матч вместо чистого пропуска: было 0 масок
  # (утечка, но не порча), стало 2 неполных куска (недобор границ). Находка
  # A2-NEWLINE-CROSS: `\s` в значении матчит и НАСТОЯЩИЙ перенос строки
  # прозы, и СТРУКТУРНУЮ границу сегмента/ячейки — они неразличимы в общем
  # тексте сегмента, а вторая опаснее первой.
  # ЭТАП A7 — ДВОЙНИКИ ЦИФР ВНУТРИ ЗНАЧЕНИЯ (долг ADDRB-BIRTHDATE-EXPOSED
  # и остаток Stage3-A). «Дата рождения: 21.0І.196О» (кириллические І/О
  # на месте 1/0) не бралась НИКОГДА: нормализатор намеренно не сводит
  # одиночную букву внутри числа (порог «>=2 настоящих цифры» защищает
  # «кв. 2б»), а группы даты разделены ТОЧКАМИ — цифровой цепью A5 они
  # не связываются (точка не разделитель цепи). Чинить это в
  # нормализаторе значило бы ослабить защиту адреса во всём документе,
  # поэтому двойник допущен ТОЛЬКО ЗДЕСЬ — в значении ПОД ЯКОРЕМ
  # рождения, где ложное срабатывание требует формы ДД.ММ.ГГГГ рядом со
  # словом «рождения». Класс двойников — ровно normalizer._DIGIT_LOOKALIKE.
  # Lookbehind того же класса нужен из-за ЖАДНОГО зазора: без него зазор
  # съедал бы ведущий двойник («З7.07.1963» -> маска «7.07.1963», недобор
  # на один символ — Stage3-A), поскольку двойник для зазора — буква.
  # якорь СПРАВА: «01.01.1980 г.р.» — постфиксная форма, в корпусе не встречается,
  # но однозначна (сам якорь и есть подтверждение), поэтому дешёвая и безопасная.
  # A7: тот же класс двойников, что и у якоря слева (см. выше).
  # [собрано фабрикой из tests/corpus_v2/typedefs/BIRTHDATE.yaml — правки только там]
  BIRTHDATE:
    method: regex
    patterns:
      - pattern: '(?i)(?:дат[аыу]\s*рожд[а-я]*|года?\s*рождения|рожд(?:ени[а-я]*|\.))[^\n\d]{0,35}(?<![0-9ОоOoЗзЧчІіб])([0-9ОоOoЗзЧчІіб]{1,2}[.\/-][0-9ОоOoЗзЧчІіб]{1,2}[.\/-][0-9ОоOoЗзЧчІіб](?:[ ]?[0-9ОоOoЗзЧчІіб]){3})(?!\d)'
        span_group: 1
      - pattern: '(?i)(?<![0-9ОоOoЗзЧчІіб])([0-9ОоOoЗзЧчІіб]{1,2}[.\/][0-9ОоOoЗзЧчІіб]{1,2}[.\/][0-9ОоOoЗзЧчІіб](?:[ ]?[0-9ОоOoЗзЧчІіб]){3})\s*(?:г\.\s?р\.|г\.\s?рожд)'
        span_group: 1
    token_prefix: 'BIRTHDATE'
    sets: [personal, personal_requisites, with_money]
    measure: {leak_class: text}
  # ЭТАП NEG — АНТИ-ЯКОРЬ ПО СЛОВУ-УТОЧНИТЕЛЮ (приём этапа A2, тип PASSPORT).
  # У PHONE нет ни якоря, ни контрольной суммы: паттерн берёт любой
  # 11-значный прогон, начатый 8/+7. Пять заведённых видов случая (лицевой
  # счёт абонента ЖКХ, регистрационный номер приложения, заводской номер
  # прибора учёта, номер записи в реестре, исходящий номер уведомления) дали
  # 138 из 138 каждый.
  # ЯКОРЬ ЗДЕСЬ ЗАВЕСТИ НЕЛЬЗЯ — телефон в договоре сплошь и рядом стоит
  # голым («тел. 8…» и просто «8…» в реквизитах), шлагбаум по слову дал бы
  # утечку целого типа. Поэтому взят СИММЕТРИЧНЫЙ приём: не «должен быть
  # сигнал», а «не должно быть дисквалификатора». Слова выбраны так, чтобы
  # НИ ОДНО не могло стоять вплотную перед телефоном: рядом с «лицевым
  # счётом», «заводским номером» и «исходящим №» телефона не бывает.
  # Окно анти-якоря — 20 знаков (`_ANTI_ANCHOR_WINDOW`), поэтому слово
  # обязано примыкать; часть видов случая оно не достаёт, и это остаток,
  # названный числом в замере, а не закрытая дыра.
  # ЭТАП FIX-2 — СВОЁ ОКНО. Умолчание в 20 знаков доставало не до всех
  # видов случая: «внесена в реестр под номером 8…» кладёт уточнитель за
  # 21 знак, «зарегистрировано за номером 8…» — за 27. Слова именные и
  # стоят в начале оборота, поэтому окно шире; телефона рядом с ними не
  # бывает ни в одном виде реквизитов, а цена по полноте меряется
  # линиями «б» и «е» гейта, а не рассуждением.
  # [собрано фабрикой из tests/corpus_v2/typedefs/PHONE.yaml — правки только там]
  PHONE:
    method: regex
    pattern: '(?<!\d)(\+7|8)[\s\-]?\(?\d{3}\)?[\s\-]?\d{3}[\s\-]?\d{2}[\s\-]?\d{2}(?!\d)'
    anti_anchor: '(?i)лицев\w*\s+сч[её]т\w*|сч[её]т\w*\s+абонент\w*|заводск\w*\s+(?:номер\w*|№)|серийн\w*\s+(?:номер\w*|№)|исходящ\w*|инвентарн\w*|артикул\w*|накладн\w*|реестр\w*|зарегистрирован\w*|регистрационн\w*\s+номер\w*'
    anti_anchor_window: 60
    token_prefix: 'PHONE'
    sets: [personal, personal_requisites, with_money]
    measure: {leak_class: numeric}
  # [собрано фабрикой из tests/corpus_v2/typedefs/EMAIL.yaml — правки только там]
  EMAIL:
    method: regex
    pattern: '[\w\.-]+@[\w\.-]+\.\w+'
    token_prefix: 'EMAIL'
    sets: [personal, personal_requisites, with_money]
    measure: {leak_class: text}
  # ЭТАП A7 — `(?i)` (долг TGOLDA-SUM-CASE). Слово валюты было единственным
  # регистрозависимым куском во всём реестре: «732 589,00 РУБ.» (шапка
  # таблицы или спецификация целиком прописными — обычная вёрстка) не
  # матчилось ВОВСЕ, miss_reason: nothing, тогда как остальные типы давно
  # смотрят на detection_text. Правка не добавляет ни одной новой ФОРМЫ
  # значения — тот же класс слов валюты, снят только регистр; правая граница
  # (?![а-яА-ЯёЁ]) была регистро-независимой изначально, поэтому «5 РУБАШЕК»
  # не берётся ни до, ни после.
  # [собрано фабрикой из tests/corpus_v2/typedefs/SUM.yaml — правки только там]
  SUM:
    method: regex
    pattern: '(?i)\d[\d  ]*+([.,]\d+)?(?:\s?\([^)\n\d]{1,120}\))?\s?(руб(лей|ля|\.)?|₽|USD|\$|долл(аров|\.)?)(?:[  ]\d{2}[  ]коп(?:еек|ейки|\.)?)?(?![а-яА-ЯёЁ])'
    token_prefix: 'SUM'
    sets: [with_money]
    measure: {leak_class: numeric}
  # пробельный класс внутри числа — только пробел/неразрывный пробел ( ), не \s, чтобы не захватывать переводы строк
  # правая граница (?![а-яА-ЯёЁ]) — чтобы не съедать часть следующего слова, напр. "5 рубашек" не должно матчиться как "5 руб" + "ашек"
  # ReDoS-fix (B1): было [\d ]*[.,]?\d* — два квантификатора по цифрам конкурировали за одни цифры =>
  # катастрофический перебор на длинной числовой строке без слова валюты. Теперь целая часть — *+ (possessive,
  # атомарна, отката назад нет), дробная часть ([.,]\d+)? обязана начинаться с разделителя и не пересекается
  # с цифровым классом. Ни один символ не может матчиться двумя квантификаторами => рост строго полиномиальный.
  # ЭТАП T2 — ПРОЦЕНТ. Решение владельца: ставки маскируются наравне с суммами.
  #
  # ИМЯ ТИПА совпадает с именем в разметке корпуса v2 (PERCENT) НАМЕРЕННО. У
  # денег имена разошлись исторически (в коде SUM, в разметке MONEY), и это
  # стоило отдельной записи соответствия в замере (tests/corpus_v2/measure_v2.py,
  # `_GOLD_ALIAS`); у новых типов такой записи нет и не заводится.
  #
  # ДВЕ ФОРМЫ ЗНАЧЕНИЯ, обе взяты из документов (не из реестра форм генератора —
  # см. «СТЕНУ» задания этапа):
  # 1) ЧИСЛО + знак/слово процента: «18%», «0,1 %», «20 (двадцать) процентов»,
  # «0,2 (две десятых процента) процента». Скобка с прописью — часть
  # значения (так пишут в договорах), поэтому входит в спан; внутри скобки
  # цифр быть не может ([^)\n\d]) — цифра там означала бы, что мы вышли за
  # конструкцию и тянем чужое число;
  # 2) ДОЛЯ КЛЮЧЕВОЙ СТАВКИ: «1/300 ключевой ставки ЦБ РФ». Числа сами по себе
  # («1/300») процентом не являются — процентом их делает именно эта
  # формула, поэтому она и есть якорь ветви.
  #
  # ОСНОВАНИЕ (необязательный хвост): «годовых», «за каждый день просрочки»,
  # «от <именная группа>». Эталон включает его в значение, и по делу: «0,1 %»
  # без базы не читается. Хвост «от …» ограничен ТРЕМЯ словами И обязан
  # ЗАКАНЧИВАТЬСЯ знаком препинания/концом строки (lookahead) — иначе он
  # съедал бы прозу дальше по предложению. Проверено на старом корпусе, где
  # такая проза есть: «0,1 % от суммы задолженности за каждый день просрочки»
  # ни на трёх, ни на двух, ни на одном слове не упирается в знак препинания —
  # ветвь хвоста отваливается целиком, и маска = «0,1 %», а не кусок фразы.
  # Цифр в хвосте нет по построению ([а-яёa-z]+): число за словом «от» — это
  # уже другая сущность (сумма/счёт), и захватывать её нельзя.
  # ЭТАП NEG — АНТИ-ЯКОРЬ ПО СЛОВУ-УТОЧНИТЕЛЮ (приём этапа A2).
  # Решение владельца этапа T2 — «ставки маскируются наравне с суммами».
  # Детектор же берёт ЛЮБОЕ число со знаком процента: пять заведённых видов
  # случая (массовая доля примеси, погрешность прибора, уклон кровли,
  # допустимая доля брака, предельная доля участия по закону) дали 138 из 138
  # каждый. Маска на влажности или на погрешности искажает спецификацию и НЕ
  # ЗАЩИЩАЕТ НИЧЕГО — технический параметр персональными данными не является.
  # Список — только слова ТЕХНИЧЕСКОГО ПАРАМЕТРА: рядом со «ставкой»,
  # «неустойкой», «вознаграждением», «НДС» ни одно из них не стоит, поэтому
  # цена по полноте ожидается нулевой и проверяется прямо (линия «б» гейта).
  # ЭТАП FIX-2 — СВОЁ ОКНО: «массовая доля ПРИМЕСИ в товаре — не более
  # 0,4 %» кладёт уточнитель за 28 знаков, «СОДЕРЖАНИЕ примеси не
  # превышает …» — за 31. Все слова списка либо технические, либо про
  # предельную долю участия по закону; ни одно не стоит при ставке,
  # неустойке, вознаграждении или НДС.
  # Одиночный пробел между цифрами (\d(?:[ ]?\d){0,3}) — тот же класс, что у
  # реквизитов (B2-fix): нормализация схлопывает разделитель лишь при дефисе
  # или прогоне >=2, поэтому «1/1 5 0» до детектора доезжает с пробелами.
  # [собрано фабрикой из tests/corpus_v2/typedefs/PERCENT.yaml — правки только там]
  PERCENT:
    method: regex
    pattern: '(?i)(?<![\d.,])(?:\d(?:[ ]?\d){0,3}\s*/\s*\d(?:[ ]?\d){0,3}\s+ключевой\s+ставки(?:\s+ЦБ\s+РФ)?|\d(?:[ ]?\d){0,3}(?:[.,]\d{1,3})?(?:\s*\([^)\n\d]{1,60}\))?\s*(?:%|процент\w*))(?:\s+годовых|\s+за\s+кажд\w+\s+день\s+просрочки|\s+от\s+[а-яёa-z]+(?:\s+[а-яёa-z]+){0,2}(?=[,.;:!?)\n]|\s*$))?'
    anti_anchor: '(?i)влажност\w*|примес\w*|погрешност\w*|прибор\w*|уклон\w*|\bбрак\w*|жирност\w*|износ\w*|содержани\w*|концентрац\w*|иностранн\w*\s+участ\w*|предельн\w*\s+дол\w*\s+иностранн\w*'
    anti_anchor_window: 60
    token_prefix: 'PERCENT'
    sets: [with_money]
    measure: {leak_class: text}
  # ЭТАП T2 — СРОК. Решение владельца: сроки маскируются.
  #
  # ДВЕ ФОРМЫ, обе из документов:
  # 1) «в течение <количество> <[уточнение]> <единица времени> [<основание>]»
  # — «в течение 7 рабочих дней», «в течение пяти банковских дней»,
  # «в течение сорока пяти календарных дней», «в течение 3 (Трёх) месяцев»;
  # 2) «не позднее <дата>» — «не позднее 08.12.2025».
  #
  # ПОЧЕМУ ЕДИНИЦА ВРЕМЕНИ ПЕРЕЧИСЛЕНА ОСНОВАМИ (дн/месяц/недел/год/лет/кварт/
  # час), а не «любым словом». Без этого якоря «в течение» + два слова съедало бы
  # начало любой фразы («в течение срока действия договора»). Это ЯКОРЬ формы, а
  # не список запрещённых значений: он говорит, ЧТО СЧИТАТЬ сроком, ровно как
  # «руб|₽|USD» говорит, что считать суммой, — и точно так же не зависит от
  # конкретных чисел.
  #
  # КОЛИЧЕСТВО может быть цифрами (с необязательной прописью в скобках) ИЛИ
  # словами, до ДВУХ слов («сорока пяти»). Слова короче трёх букв количеством не
  # считаются — иначе предлог «со» в «…месяцев СО ДНЯ предъявления» встаёт на
  # место уточнения, и спан обрывается на «со дня» (наблюдалось до правки:
  # «в течение трех месяцев со дня» вместо полного эталона).
  #
  # ОСНОВАНИЕ (необязательный хвост): «с даты …», «с момента …», «со дня …» —
  # до ближайшего знака препинания или конца строки. В хвосте ЗАПРЕЩЕНЫ ЦИФРЫ
  # ([^,.;:!?()\n\d]): именная группа основания цифр не содержит, а цифра за ней
  # означала бы чужое значение — счёт, ИНН, сумму, дату. Без этого запрета
  # длинный спан срока побеждал бы пересечение с реквизитом ПО ДЛИНЕ
  # (tokenizer._winner, правило 2) и гасил бы его маску, то есть создавал утечку.
  # ЭТАП NEG — АНТИ-ЯКОРЬ ПО СЛОВУ-УТОЧНИТЕЛЮ (приём этапа A2).
  # Якорь «в течение» — ЯКОРЬ ФОРМЫ и намеренно не зависит от смысла (см.
  # выше). Цена измерена на пяти видах случая (срок годности товара,
  # технологическая выдержка материала, срок из нормы права, справка о годах
  # работы Общества, граница отчётного периода) — 138 из 138 каждый. Худший
  # из них — срок из нормы права: маска делает ссылку на закон нечитаемой.
  # Дисквалификаторы — слова, которые НЕ МОГУТ стоять вплотную перед сроком
  # обязательства Стороны: «годности», «хранению», «выдерживается».
  # Окно 20 знаков, слово обязано примыкать — виды случая, где уточнитель
  # стоит дальше (ссылка на статью — ПОСЛЕ значения), этим приёмом не
  # закрываются и остаются числом в замере.
  # ЭТАП FIX-2 — СВОЁ ОКНО: «Общество ОСУЩЕСТВЛЯЕТ ДЕЯТЕЛЬНОСТЬ в течение
  # 11 лет» и «ОТЧЁТНЫЙ ПЕРИОД по Договору завершается не позднее …»
  # кладут уточнитель за 26-48 знаков. Обороты взяты ЦЕЛИКОМ
  # («осуществляет деятельность», а не «деятельность»): одиночное слово
  # стояло бы и перед настоящим сроком — «приостановление деятельности
  # в течение 30 дней».
  # [собрано фабрикой из tests/corpus_v2/typedefs/TERM.yaml — правки только там]
  TERM:
    method: regex
    pattern: '(?i)(?:в\s+течение\s+(?:\d(?:[ ]?\d){0,3}(?:\s*\([^)\n\d]{1,40}\))?|[а-яё]{3,}(?:\s+[а-яё]{3,})?)(?:\s+[а-яё]{3,})?\s+(?:дн\w*|месяц\w*|недел\w*|год\w*|лет|кварта\w*|час\w*)|не\s+позднее\s+\d(?:[ ]?\d){0,3}\s?[./]\s?\d(?:[ ]?\d){0,3}\s?[./]\s?\d(?:[ ]?\d){3})(?:\s+(?:с|со)\s+(?:дат\w+|момента|дня)\s+[^,.;:!?()\n\d]{1,80}?(?=[,.;:!?()\n]|$))?'
    anti_anchor: '(?i)годност\w*|хранени\w*|хранению|хранит\w*|выдержива\w*|выдержк\w*|исков\w*\s+давност\w*|осуществля\w*\s+деятельност\w*|работает\s+на\s+рынке|присутству\w*\s+на\s+рынке|отч[её]тн\w*\s+период\w*'
    anti_anchor_window: 60
    token_prefix: 'TERM'
    sets: [with_money]
    measure: {leak_class: text}
  # ЭТАП T4 — ОТРИЦАТЕЛЬНЫЕ КЛАССЫ. Три типа ниже НИКОГДА не маскируются (нет
  # token_prefix — _load_token_prefixes их не видит, физически нечем заменить их
  # в тексте). Они эмитятся как Entity и доходят до tokenizer._resolve_overlaps,
  # где действуют БАРЬЕРОМ: пересекающийся кандидат другого типа обрезается/
  # проигрывает им ровно так же, как проигрывает regex-реквизиту или структурному
  # ORG/PER (см. ARCHITECTURE.md, инвариант разрешения пересечений). Разворот —
  # одной правкой конфига: `suppress_masking: false` ИЛИ `enabled: false`
  # (любое из двух выключает эмиссию класса целиком, барьер исчезает, маски
  # соседних типов возвращаются в прежнем виде — см. docs/archive/reports/T4_REPORT.md, приёмка).
  # `suppress_masking: true` — состояние по умолчанию для этих трёх типов,
  # решение владельца (ЗАЧЕМ этапа T4).
  # [собрано фабрикой из tests/corpus_v2/typedefs/DATE.yaml — правки только там]
  DATE:
    method: regex
    pattern: '\d{1,2}[.\/]\d{1,2}[.\/]\d{2,4}'
    enabled: false
    token_prefix: 'DATE'
    sets: []
    measure: {leak_class: text}
  # CLAUSE_REF — номер пункта/раздела/приложения договора. Структурно, БЕЗ
  # словаря значений: (1) цепочка ≥2 групп цифр через ТОЛЬКО точки, каждая
  # группа ≤3 цифр — что исключает год (BIRTHDATE/DATE всегда несут 4-значную
  # группу) и тем разводит «3.2»/«7.1.4» с «21.01.1990»; (2) родовое слово
  # (пункт/раздел/приложение, опознаётся усечением основы — та же техника, что
  # у остальных якорных детекторов, напр. «рожд\w*» у BIRTHDATE) + номер.
  # Уже кусалось дважды до этого этапа (STATE.md, этап S3): «3.2» маскировалось
  # как ADDRESS, чинилось починкой вида (_addr_deweave); чинить пришлось код
  # представления, а не сам класс — этот тип формализует то же самое явно.
  CLAUSE_REF:
    method: regex
    patterns:
      - pattern: '(?<!\d)\d{1,3}(?:\.\d{1,3}){1,3}(?!\.?\d)'
      - pattern: '(?i)\b(?:пункт\w*|раздел\w*|приложени\w*)\s*(?:№\s*)?\d{1,3}(?:\.\d{1,3}){0,3}\b'
    suppress_masking: true

  # ROLE_TERM/COLLECTIVE — формализация механизмов M2/M1b этапа C′
  # (src/anchor_registry.py, OrgAnchorDetector): те же структурные условия, тем
  # же кодом (anchor_registry.detect_negative_classes переиспользует _find_quoted/
  # _orgform_start_left/_is_definition_term/_INTRO_RE/_is_collective_head — НЕ
  # дублирует их), но теперь ЯВНО эмитятся как Entity, а не молча пропускаются
  # (`continue` без следа). detect() САМ по себе не тронут ни строкой — ORG
  # получает ровно те же якоря, что и до этапа T4 (см. tests/test_negative_classes.py).
  #
  # ROLE_TERM — роль-термин формулы переименования («…, именуемое в дальнейшем
  # «Заказчик»»): кавычки БЕЗ примыкающей org-формы + конструкция введения
  # («именуем…»/«далее»/«в дальнейшем») слева. Отличие от «Name» (название
  # организации) — ровно то же, что уже решает кавычная ветвь ORG: форма
  # примыкает -> Name -> ORG; не примыкает -> Роль -> сюда. method здесь условный
  # маркер (эмиссия идёт из anchor_registry.detect_negative_classes, не из
  # общего движка AnchorEngine — ROLE_TERM не участвует в реестре/проходе 2,
  # ему не нужна кореференция по падежам).
  ROLE_TERM:
    method: anchor_registry
    suppress_masking: true

  # COLLECTIVE — обобщение сторон/групп («Стороны», «Акционеры», «Участники»):
  # org-форма + голое имя, чья ВЕРШИНА — множественное нарицательное
  # (`_is_collective_head`, помета pymorphy plur+NOUN без Name/Surn/Patr/Geox/
  # Orgn/Trad). Организация — сингулярная именованная сущность, коллектив — нет.
  COLLECTIVE:
    method: anchor_registry
    suppress_masking: true

  # [собрано фабрикой из tests/corpus_v2/typedefs/CONTRACT_NO.yaml — правки только там]
  CONTRACT_NO:
    method: regex
    pattern: '(?i)(?:договор\w*|соглашени\w*|контракт\w*)[^\n\d№n]{0,25}(?:№|номер\w*|\bn\b)\s*((?!\d{11})(?=[0-9а-яёa-z/-]{0,25}\d)[0-9а-яёa-z][0-9а-яёa-z/-]{0,24}[0-9а-яёa-z]|[0-9]{1,2}(?!\d))'
    span_group: 1
    token_prefix: 'CONTRACT'
    sets: [with_money]
    measure: {leak_class: numeric}

  # [собрано фабрикой из tests/corpus_v2/typedefs/REG_ID.yaml — правки только там]
  REG_ID:
    method: regex
    pattern: '\b\d(?:[  ]?\d){8}\b'
    anchor: '(?i)реестр\w*|регистрац\w*'
    token_prefix: 'REGID'
    sets: [personal_requisites, with_money]
    measure: {leak_class: numeric}

  # [собрано фабрикой из tests/corpus_v2/typedefs/REG_NUMBER.yaml — правки только там]
  REG_NUMBER:
    method: regex
    pattern: '(?i)(?<![\d/])\d{1,3}\s?/\s?\d{1,5}-н\s?/\s?\d(?:[ ]?\d){6,14}(?![\d/])'
    token_prefix: 'REGNUM'
    sets: [personal_requisites, with_money]
    measure: {leak_class: numeric}

  # [собрано фабрикой из tests/corpus_v2/typedefs/SHARE_PCT.yaml — правки только там]
  SHARE_PCT:
    method: regex
    pattern: '(?i)(?<![\d.,])\d(?:[ ]?\d){0,2}(?:[.,]\d{1,2})?\s?(?:%|процент\w*)\s+(?:голос\w*(?:\s+от\s+общего\s+числа)?|(?:долей\s+)?(?:в\s+)?уставн\w+\s+капитал\w*|акци\w+)'
    token_prefix: 'SHARE'
    sets: [with_money]
    measure: {leak_class: text}

  # [собрано фабрикой из tests/corpus_v2/typedefs/TRANCHE.yaml — правки только там]
  TRANCHE:
    method: regex
    pattern: '(?i)транш\w*\s*[«"„][^»"“\n]{1,60}[»"“]'
    token_prefix: 'TRANCHE'
    sets: [with_money]
    measure: {leak_class: text}

# Порядок арбитража пересечений (rule 3/rule 4 tokenizer._winner).
# СОБРАН из базового порядка (до фабрики) и rank фабричных типов.
arbitration_order:
  regex: [BANK_ACCOUNT, OGRN, INN, INN_PERSON, BIK, SNILS, REG_ID, KPP, PASSPORT, PHONE, REG_NUMBER, CONTRACT_NO, SUM, EMAIL, BIRTHDATE, DATE, SHARE_PCT, PERCENT, TRANCHE, TERM]
  ner: [ADDRESS, ORG, PERSON]
