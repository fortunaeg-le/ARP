# Этап 1b — политика непрочитанных зон .docx (колонтитулы, сноски, надписи,
# вложенные таблицы). true (умолчание, fail-closed): encrypt ОТКАЗЫВАЕТСЯ работать
# с документом, часть текста которого система прочитать не умеет — молчаливая
# потеря куска договора опаснее, чем отказ. false: работать, но громко предупредить
# и записать текст зон в {session_id}.unread.json (то же, что флаг --allow-lossy).
# Читается только блоком 7 (shifrator.py); детекторы этот ключ игнорируют.
strict_zones: true

entity_types:
  # ЭТАП B (structure-first PER). Natasha-PER на прозе ВЫКЛЮЧЕНА (убран ner_label,
  # как ORG на этапе A): NER-тэггер рвал косвенный падеж на два спана (PER-B) и давал
  # ложные PER на родовых словах (Участник→PERSON). ФИО теперь даёт ТОЛЬКО
  # src/anchor_registry.py (PerAnchorDetector: якорь по форме ФИО/должности/«в лице»/
  # «гражданин»/ИНН-12/СНИЛС + проход 2 по лемме ФАМИЛИИ, косвенный падеж одним
  # спаном). Безъякорная одиночная фамилия сознательно пропускается (класс Aprime-1).
  # token_prefix оставлен — тип по-прежнему токенизируется.
  PERSON:
    method: anchor_registry
    anchor_type: PER
    token_prefix: PERSON
    # Вхождение в наборы type_policy (этап TYPE-FACTORY шаг 2);
    # «Максимум» — сентинел, не перечисляется.
    sets: [personal, personal_requisites, with_money]
  # ЭТАП A (structure-first ORG). Natasha-ORG на прозе ВЫКЛЮЧЕНА: убран ner_label,
  # поэтому _load_ner_config не кладёт ORG в ner_label_map — NER-тэггер ORG больше
  # не даёт (он метил юр-мусор: Большинство→ORG, а одно имя фирмы в падежах — разные
  # типы, см. archive/reports/HANDOFF_A0_GLINER.md). ORG теперь даёт ТОЛЬКО
  # src/anchor_registry.py (якорь по org-форме/кавычкам/введению/ИНН-ОГРН юрлица +
  # проход 2 по лемме ядра). token_prefix оставлен — тип по-прежнему токенизируется.
  ORG:
    method: anchor_registry
    anchor_type: ORG
    token_prefix: ORG
    # Вхождение в наборы type_policy (этап TYPE-FACTORY шаг 2);
    # «Максимум» — сентинел, не перечисляется.
    sets: [personal_requisites, with_money]
  ADDRESS:
    method: ner
    ner_extractor: addr        # НЕ ner_label/LOC — см. требования Блока 3: используется natasha.AddrExtractor, а не NER-тэггер
    token_prefix: ADDRESS
    # Вхождение в наборы type_policy (этап TYPE-FACTORY шаг 2);
    # «Максимум» — сентинел, не перечисляется.
    sets: [personal, personal_requisites, with_money]
  # @TYPEDEF: INN
  # @TYPEDEF: INN_PERSON
  # @TYPEDEF: OGRN
  # @TYPEDEF: KPP
  # @TYPEDEF: BANK_ACCOUNT
  # @TYPEDEF: BIK
  # @TYPEDEF: PASSPORT
  # @TYPEDEF: SNILS
  # @TYPEDEF: BIRTHDATE
  # @TYPEDEF: PHONE
  # @TYPEDEF: EMAIL
  SUM:
    method: regex
    # ЭТАП A7 — `(?i)` (долг TGOLDA-SUM-CASE). Слово валюты было единственным
    # регистрозависимым куском во всём реестре: «732 589,00 РУБ.» (шапка
    # таблицы или спецификация целиком прописными — обычная вёрстка) не
    # матчилось ВОВСЕ, miss_reason: nothing, тогда как остальные типы давно
    # смотрят на detection_text. Правка не добавляет ни одной новой ФОРМЫ
    # значения — тот же класс слов валюты, снят только регистр; правая граница
    # (?![а-яА-ЯёЁ]) была регистро-независимой изначально, поэтому «5 РУБАШЕК»
    # не берётся ни до, ни после.
    pattern: '(?i)\d[\d  ]*+([.,]\d+)?\s?(руб(лей|ля|\.)?|₽|USD|\$|долл(аров|\.)?)(?![а-яА-ЯёЁ])'
    token_prefix: SUM
    # Вхождение в наборы type_policy (этап TYPE-FACTORY шаг 2);
    # «Максимум» — сентинел, не перечисляется.
    sets: [with_money]
    # пробельный класс внутри числа — только пробел/неразрывный пробел ( ), не \s, чтобы не захватывать переводы строк
    # правая граница (?![а-яА-ЯёЁ]) — чтобы не съедать часть следующего слова, напр. "5 рубашек" не должно матчиться как "5 руб" + "ашек"
    # ReDoS-fix (B1): было [\d ]*[.,]?\d* — два квантификатора по цифрам конкурировали за одни цифры =>
    # катастрофический перебор на длинной числовой строке без слова валюты. Теперь целая часть — *+ (possessive,
    # атомарна, отката назад нет), дробная часть ([.,]\d+)? обязана начинаться с разделителя и не пересекается
    # с цифровым классом. Ни один символ не может матчиться двумя квантификаторами => рост строго полиномиальный.
  # ЭТАП T2 — ПРОЦЕНТ. Решение владельца: ставки маскируются наравне с суммами.
  #
  # ИМЯ ТИПА совпадает с именем в разметке корпуса v2 (PERCENT) НАМЕРЕННО. У
  # денег имена разошлись исторически (в коде SUM, в разметке MONEY), и это
  # стоило отдельной записи соответствия в замере (tests/corpus_v2/measure_v2.py,
  # `_GOLD_ALIAS`); у новых типов такой записи нет и не заводится.
  #
  # ДВЕ ФОРМЫ ЗНАЧЕНИЯ, обе взяты из документов (не из реестра форм генератора —
  # см. «СТЕНУ» задания этапа):
  #   1) ЧИСЛО + знак/слово процента: «18%», «0,1 %», «20 (двадцать) процентов»,
  #      «0,2 (две десятых процента) процента». Скобка с прописью — часть
  #      значения (так пишут в договорах), поэтому входит в спан; внутри скобки
  #      цифр быть не может ([^)\n\d]) — цифра там означала бы, что мы вышли за
  #      конструкцию и тянем чужое число;
  #   2) ДОЛЯ КЛЮЧЕВОЙ СТАВКИ: «1/300 ключевой ставки ЦБ РФ». Числа сами по себе
  #      («1/300») процентом не являются — процентом их делает именно эта
  #      формула, поэтому она и есть якорь ветви.
  #
  # ОСНОВАНИЕ (необязательный хвост): «годовых», «за каждый день просрочки»,
  # «от <именная группа>». Эталон включает его в значение, и по делу: «0,1 %»
  # без базы не читается. Хвост «от …» ограничен ТРЕМЯ словами И обязан
  # ЗАКАНЧИВАТЬСЯ знаком препинания/концом строки (lookahead) — иначе он
  # съедал бы прозу дальше по предложению. Проверено на старом корпусе, где
  # такая проза есть: «0,1 % от суммы задолженности за каждый день просрочки»
  # ни на трёх, ни на двух, ни на одном слове не упирается в знак препинания —
  # ветвь хвоста отваливается целиком, и маска = «0,1 %», а не кусок фразы.
  # Цифр в хвосте нет по построению ([а-яёa-z]+): число за словом «от» — это
  # уже другая сущность (сумма/счёт), и захватывать её нельзя.
  PERCENT:
    method: regex
    pattern: '(?i)(?<![\d.,])(?:\d(?:[ ]?\d){0,3}\s*/\s*\d(?:[ ]?\d){0,3}\s+ключевой\s+ставки(?:\s+ЦБ\s+РФ)?|\d(?:[ ]?\d){0,3}(?:[.,]\d{1,3})?(?:\s*\([^)\n\d]{1,60}\))?\s*(?:%|процент\w*))(?:\s+годовых|\s+за\s+кажд\w+\s+день\s+просрочки|\s+от\s+[а-яёa-z]+(?:\s+[а-яёa-z]+){0,2}(?=[,.;:!?)\n]|\s*$))?'
    # ЭТАП NEG — АНТИ-ЯКОРЬ ПО СЛОВУ-УТОЧНИТЕЛЮ (приём этапа A2).
    # Решение владельца этапа T2 — «ставки маскируются наравне с суммами».
    # Детектор же берёт ЛЮБОЕ число со знаком процента: пять заведённых видов
    # случая (массовая доля примеси, погрешность прибора, уклон кровли,
    # допустимая доля брака, предельная доля участия по закону) дали 138 из 138
    # каждый. Маска на влажности или на погрешности искажает спецификацию и НЕ
    # ЗАЩИЩАЕТ НИЧЕГО — технический параметр персональными данными не является.
    # Список — только слова ТЕХНИЧЕСКОГО ПАРАМЕТРА: рядом со «ставкой»,
    # «неустойкой», «вознаграждением», «НДС» ни одно из них не стоит, поэтому
    # цена по полноте ожидается нулевой и проверяется прямо (линия «б» гейта).
    anti_anchor: '(?i)влажност\w*|примес\w*|погрешност\w*|прибор\w*|уклон\w*|\bбрак\w*|жирност\w*|износ\w*|содержани\w*|концентрац\w*|иностранн\w*\s+участ\w*|предельн\w*\s+дол\w*\s+иностранн\w*'
    # ЭТАП FIX-2 — СВОЁ ОКНО: «массовая доля ПРИМЕСИ в товаре — не более
    # 0,4 %» кладёт уточнитель за 28 знаков, «СОДЕРЖАНИЕ примеси не
    # превышает …» — за 31. Все слова списка либо технические, либо про
    # предельную долю участия по закону; ни одно не стоит при ставке,
    # неустойке, вознаграждении или НДС.
    anti_anchor_window: 60
    token_prefix: PERCENT
    # Вхождение в наборы type_policy (этап TYPE-FACTORY шаг 2);
    # «Максимум» — сентинел, не перечисляется.
    sets: [with_money]
    # Одиночный пробел между цифрами (\d(?:[ ]?\d){0,3}) — тот же класс, что у
    # реквизитов (B2-fix): нормализация схлопывает разделитель лишь при дефисе
    # или прогоне >=2, поэтому «1/1 5 0» до детектора доезжает с пробелами.

  # ЭТАП T2 — СРОК. Решение владельца: сроки маскируются.
  #
  # ДВЕ ФОРМЫ, обе из документов:
  #   1) «в течение <количество> <[уточнение]> <единица времени> [<основание>]»
  #      — «в течение 7 рабочих дней», «в течение пяти банковских дней»,
  #      «в течение сорока пяти календарных дней», «в течение 3 (Трёх) месяцев»;
  #   2) «не позднее <дата>» — «не позднее 08.12.2025».
  #
  # ПОЧЕМУ ЕДИНИЦА ВРЕМЕНИ ПЕРЕЧИСЛЕНА ОСНОВАМИ (дн/месяц/недел/год/лет/кварт/
  # час), а не «любым словом». Без этого якоря «в течение» + два слова съедало бы
  # начало любой фразы («в течение срока действия договора»). Это ЯКОРЬ формы, а
  # не список запрещённых значений: он говорит, ЧТО СЧИТАТЬ сроком, ровно как
  # «руб|₽|USD» говорит, что считать суммой, — и точно так же не зависит от
  # конкретных чисел.
  #
  # КОЛИЧЕСТВО может быть цифрами (с необязательной прописью в скобках) ИЛИ
  # словами, до ДВУХ слов («сорока пяти»). Слова короче трёх букв количеством не
  # считаются — иначе предлог «со» в «…месяцев СО ДНЯ предъявления» встаёт на
  # место уточнения, и спан обрывается на «со дня» (наблюдалось до правки:
  # «в течение трех месяцев со дня» вместо полного эталона).
  #
  # ОСНОВАНИЕ (необязательный хвост): «с даты …», «с момента …», «со дня …» —
  # до ближайшего знака препинания или конца строки. В хвосте ЗАПРЕЩЕНЫ ЦИФРЫ
  # ([^,.;:!?()\n\d]): именная группа основания цифр не содержит, а цифра за ней
  # означала бы чужое значение — счёт, ИНН, сумму, дату. Без этого запрета
  # длинный спан срока побеждал бы пересечение с реквизитом ПО ДЛИНЕ
  # (tokenizer._winner, правило 2) и гасил бы его маску, то есть создавал утечку.
  TERM:
    method: regex
    pattern: '(?i)(?:в\s+течение\s+(?:\d(?:[ ]?\d){0,3}(?:\s*\([^)\n\d]{1,40}\))?|[а-яё]{3,}(?:\s+[а-яё]{3,})?)(?:\s+[а-яё]{3,})?\s+(?:дн\w*|месяц\w*|недел\w*|год\w*|лет|кварта\w*|час\w*)|не\s+позднее\s+\d(?:[ ]?\d){0,3}\s?[./]\s?\d(?:[ ]?\d){0,3}\s?[./]\s?\d(?:[ ]?\d){3})(?:\s+(?:с|со)\s+(?:дат\w+|момента|дня)\s+[^,.;:!?()\n\d]{1,80}?(?=[,.;:!?()\n]|$))?'
    # ЭТАП NEG — АНТИ-ЯКОРЬ ПО СЛОВУ-УТОЧНИТЕЛЮ (приём этапа A2).
    # Якорь «в течение» — ЯКОРЬ ФОРМЫ и намеренно не зависит от смысла (см.
    # выше). Цена измерена на пяти видах случая (срок годности товара,
    # технологическая выдержка материала, срок из нормы права, справка о годах
    # работы Общества, граница отчётного периода) — 138 из 138 каждый. Худший
    # из них — срок из нормы права: маска делает ссылку на закон нечитаемой.
    # Дисквалификаторы — слова, которые НЕ МОГУТ стоять вплотную перед сроком
    # обязательства Стороны: «годности», «хранению», «выдерживается».
    # Окно 20 знаков, слово обязано примыкать — виды случая, где уточнитель
    # стоит дальше (ссылка на статью — ПОСЛЕ значения), этим приёмом не
    # закрываются и остаются числом в замере.
    anti_anchor: '(?i)годност\w*|хранени\w*|хранению|хранит\w*|выдержива\w*|выдержк\w*|исков\w*\s+давност\w*|осуществля\w*\s+деятельност\w*|работает\s+на\s+рынке|присутству\w*\s+на\s+рынке|отч[её]тн\w*\s+период\w*'
    # ЭТАП FIX-2 — СВОЁ ОКНО: «Общество ОСУЩЕСТВЛЯЕТ ДЕЯТЕЛЬНОСТЬ в течение
    # 11 лет» и «ОТЧЁТНЫЙ ПЕРИОД по Договору завершается не позднее …»
    # кладут уточнитель за 26-48 знаков. Обороты взяты ЦЕЛИКОМ
    # («осуществляет деятельность», а не «деятельность»): одиночное слово
    # стояло бы и перед настоящим сроком — «приостановление деятельности
    # в течение 30 дней».
    anti_anchor_window: 60
    token_prefix: TERM
    # Вхождение в наборы type_policy (этап TYPE-FACTORY шаг 2);
    # «Максимум» — сентинел, не перечисляется.
    sets: [with_money]

  # @TYPEDEF: DATE
  # CLAUSE_REF — номер пункта/раздела/приложения договора. Структурно, БЕЗ
  # словаря значений: (1) цепочка ≥2 групп цифр через ТОЛЬКО точки, каждая
  # группа ≤3 цифр — что исключает год (BIRTHDATE/DATE всегда несут 4-значную
  # группу) и тем разводит «3.2»/«7.1.4» с «21.01.1990»; (2) родовое слово
  # (пункт/раздел/приложение, опознаётся усечением основы — та же техника, что
  # у остальных якорных детекторов, напр. «рожд\w*» у BIRTHDATE) + номер.
  # Уже кусалось дважды до этого этапа (STATE.md, этап S3): «3.2» маскировалось
  # как ADDRESS, чинилось починкой вида (_addr_deweave); чинить пришлось код
  # представления, а не сам класс — этот тип формализует то же самое явно.
  CLAUSE_REF:
    method: regex
    patterns:
      - pattern: '(?<!\d)\d{1,3}(?:\.\d{1,3}){1,3}(?!\.?\d)'
      - pattern: '(?i)\b(?:пункт\w*|раздел\w*|приложени\w*)\s*(?:№\s*)?\d{1,3}(?:\.\d{1,3}){0,3}\b'
    suppress_masking: true

  # ROLE_TERM/COLLECTIVE — формализация механизмов M2/M1b этапа C′
  # (src/anchor_registry.py, OrgAnchorDetector): те же структурные условия, тем
  # же кодом (anchor_registry.detect_negative_classes переиспользует _find_quoted/
  # _orgform_start_left/_is_definition_term/_INTRO_RE/_is_collective_head — НЕ
  # дублирует их), но теперь ЯВНО эмитятся как Entity, а не молча пропускаются
  # (`continue` без следа). detect() САМ по себе не тронут ни строкой — ORG
  # получает ровно те же якоря, что и до этапа T4 (см. tests/test_negative_classes.py).
  #
  # ROLE_TERM — роль-термин формулы переименования («…, именуемое в дальнейшем
  # «Заказчик»»): кавычки БЕЗ примыкающей org-формы + конструкция введения
  # («именуем…»/«далее»/«в дальнейшем») слева. Отличие от «Name» (название
  # организации) — ровно то же, что уже решает кавычная ветвь ORG: форма
  # примыкает -> Name -> ORG; не примыкает -> Роль -> сюда. method здесь условный
  # маркер (эмиссия идёт из anchor_registry.detect_negative_classes, не из
  # общего движка AnchorEngine — ROLE_TERM не участвует в реестре/проходе 2,
  # ему не нужна кореференция по падежам).
  ROLE_TERM:
    method: anchor_registry
    suppress_masking: true

  # COLLECTIVE — обобщение сторон/групп («Стороны», «Акционеры», «Участники»):
  # org-форма + голое имя, чья ВЕРШИНА — множественное нарицательное
  # (`_is_collective_head`, помета pymorphy plur+NOUN без Name/Surn/Patr/Geox/
  # Orgn/Trad). Организация — сингулярная именованная сущность, коллектив — нет.
  COLLECTIVE:
    method: anchor_registry
    suppress_masking: true
