# Файл-описание типа (фабрика типов, сессия 2). Правится ТОЛЬКО здесь;
# entity_types.yaml собирает tests/corpus_v2/assemble_types.py.
type: DATE
title: Дата
status: active
detect:
  form:
    class: raw
    # ТРИ ВЕТВИ ФОРМЫ. Общий хвост «г.»/«года» — необязательный и ОДИН на все три
    # (эталон корпуса v2 пишет дату вместе с ним: «24.07.2007 г.»).
    #  1) ЦИФРОВАЯ: дд.мм.гггг и дд/мм/гггг. Год — РОВНО ЧЕТЫРЕ цифры с
    #     одиночным пробелом внутри (`\d(?:[ ]?\d){3}`, тот же класс, что у
    #     BIRTHDATE: мутация digit_spaces пробел не схлопывает).
    #  2) СЛОВЕСНАЯ: «12» марта 2023 г. / 12 марта 2023 года. Кавычки
    #     необязательны, месяц — усечением основы (приём «рожд\w*» у BIRTHDATE).
    #  3) ПОРЯДКОВОЕ ЧИСЛИТЕЛЬНОЕ: двенадцатого марта [2023 года | две тысячи
    #     двадцать третьего года]. Год необязателен и бывает и цифрами, и словами.
    pattern: '(?i)(?:(?<!\d)(?<![\d][.\/])\d{1,2}[.\/]\d{1,2}[.\/]\d(?:[ ]?\d){3}(?!\d)|(?<![\w\d])[«"“]?\d{1,2}[»"”]?[ ]{1,2}(?:январ\w*|феврал\w*|март\w*|апрел\w*|ма[йя]|июн\w*|июл\w*|август\w*|сентябр\w*|октябр\w*|ноябр\w*|декабр\w*)[ ]{1,2}\d(?:[ ]?\d){3}|(?<![\w\d])(?:(?:двадцать|тридцать)[ ]{1,2})?(?:перв|втор|треть|четв[ёе]рт|пят|шест|седьм|восьм|девят|десят|одиннадцат|двенадцат|тринадцат|четырнадцат|пятнадцат|шестнадцат|семнадцат|восемнадцат|девятнадцат|двадцат|тридцат)(?:ого|его)[ ]{1,2}(?:январ\w*|феврал\w*|март\w*|апрел\w*|ма[йя]|июн\w*|июл\w*|август\w*|сентябр\w*|октябр\w*|ноябр\w*|декабр\w*)(?:[ ]{1,2}(?:(?:две|двух)[ ]{1,2}тысяч[иа](?:[ ]{1,2}[а-яё]+){1,3}|\d(?:[ ]?\d){3}))?)(?:[ ]{0,2}г(?:ода|\.)(?![ ]?р\.))?'
  token_prefix: 'DATE'
  rank: 1300
  sets: [personal, personal_requisites, with_money]
  sets_why: >-
    решение владельца 2026-08-17 «дату включить во всех наборах», включая набор
    по умолчанию: в договоре дата стоит рядом с ФИО и паспортом и вместе с ними
    сужает круг лиц; набор, где паспорт закрыт, а дата выдачи открыта, защищал
    бы только на вид (тот же довод, что у PASSPORT_ISSUER на этапе MERGE-2)
  measure: {leak_class: text}
generator: legacy
notes: |
  ЭТАП DATE-ON (2026-08-18). До него тип стоял `enabled: false` С ПЕРВОГО
  КОММИТА проекта (92b113f «block 1: extractor», 2026-07-12) и служил в
  HANDOFF_2 примером механизма «выключенный тип». Причин выключения найдено
  ДВЕ, обе записаны, обе СНЯТЫ решением владельца, а не забыты:
    1) «НЕ детектор дат: договор состоит из дат (подписания, выдачи, сроков),
       общий детектор дат обвалил бы precision» — заметка этапа 3 в описании
       BIRTHDATE (файл рядом). Дыра «дата рождения не ищется» была закрыта
       ОТДЕЛЬНЫМ якорным типом BIRTHDATE, и общая дата осталась выключенной;
    2) разметка корпуса v2 объявляла дату документа ТИПИЗИРОВАННЫМ НЕГАТИВОМ
       («дата документа — не ПДн», 138 вхождений, values.docdate). Это
       ОПРЕДЕЛЕНИЕ, а не дефект детектора — ровно тот случай, что уже был с
       номером договора: владелец сменил определение, и вхождения переехали
       из negatives в entities (этап MARKUP-V2, values.docnum). Здесь сделано
       то же самое тем же способом.

  ЧЕТЫРЁХЗНАЧНЫЙ ГОД — НЕ УЖЕСТОЧЕНИЕ, А ДОГОВОР С CLAUSE_REF. Прежний паттерн
  брал `\d{2,4}` в год. Барьер CLAUSE_REF построен на прямо противоположном
  допущении, записанном у него же в конфиге: «каждая группа <=3 цифр — что
  исключает год (BIRTHDATE/DATE всегда несут 4-значную группу) и тем разводит
  «3.2»/«7.1.4» с «21.01.1990»». С `\d{2,4}` номер пункта вида «7.1.10» попадал
  в форму даты, а при равной длине спана арбитраж отдал бы его ДАТЕ, а не
  CLAUSE_REF (CLAUSE_REF в arbitration_order не значится — он без token_prefix,
  и `_regex_rank` кладёт его слабее любого перечисленного типа). Замер обеих
  корпусов: `\d{2,3}`-хвост встречается 51 раз и ВЕЗДЕ это испорченная мутацией
  дата (см. «Дата рождения: 15.11.199 6»), ни одного настоящего номера пункта —
  то есть сужение не стоило ни одной живой формы, а дыру закрыло.

  ГРАНИЦЫ СЛЕВА И СПРАВА, которых у прежнего паттерна не было вовсе:
  `(?<!\d)` и `(?!\d)` не дают вырезать дату из середины длинного прогона цифр,
  `(?<![\d][.\/])` — из середины точечной цепочки («1.15.04.2023» не даёт
  «15.04.2023»: это структура нумерации, а не дата).

  ХВОСТ «г.»/«года» ВХОДИТ В СПАН (так его пишет эталон корпуса v2), но НЕ
  ПРИМЕНЯЕТСЯ перед «р.»: «01.01.1980 г.р.» — это правая якорная форма
  BIRTHDATE, и без этой оговорки DATE отобрал бы у неё пересечение по длине
  спана (правило 2 арбитража сильнее приоритета типа).

  ПРОБЕЛЬНЫЕ КЛАССЫ — только `[ ]`, нигде не `\s`: находка A2-NEWLINE-CROSS
  (`\s` внутри значения матчит и СТРУКТУРНУЮ границу сегмента/ячейки, что даёт
  разорванный частичный матч вместо чистого пропуска).
