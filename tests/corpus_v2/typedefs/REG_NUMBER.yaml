# Файл-описание типа (фабрика типов). Правится ТОЛЬКО здесь;
# entity_types.yaml собирает tests/corpus_v2/assemble_types.py.
type: REG_NUMBER
title: Реестровый номер
status: active
detect:
  form:
    class: raw
    # Формульный номер нотариального реестра ЕИС: регион/контора-н/регион-год-
    # разделы. Детекция идёт по НОРМАЛИЗОВАННОМУ тексту (этап 2): дефис между
    # цифрами схлопнут, поэтому хвост «77-2024-1-502» доезжает до детектора
    # прогоном «7720241502» (7-15 цифр). Якорь формы — «/…-н/»: без буквенной
    # группы голая пара «число/число» не берётся.
    pattern: '(?i)(?<![\d/])\d{1,3}\s?/\s?\d{1,5}-н\s?/\s?\d(?:[ ]?\d){6,14}(?![\d/])'
  token_prefix: REGNUM
  rank: 950
  sets: [personal_requisites, with_money]
  measure: {leak_class: numeric}
generator:
  provenance: >-
    черновик 2 владельца, позиция В1(б)4; форма из живой документации
    (реестровый номер нотариального действия)
  weave:
    intro: 'Полномочия представителя подтверждены доверенностью, реестровый номер '
    outro: '.'
    neg_intro: 'Для сопоставления в учёте указывается: '
  examples:
    - "77/714-н/77-2024-1-502"
    - "50/121-н/50-2023-4-88"
    - "23/5-н/23-2025-2-1104"
    - "78/1445-н/78-2022-12-7"
    - "16/89-н/16-2024-3-215"
  negatives:
    - kind: cadastral
      text: "кадастровый номер 77:01:0004012:2211"
      why: "чужая номенклатура: двоеточия, нет группы «-н» — не реестровый номер стороны"
    - kind: gost-ref
      text: "ГОСТ Р 52044-2003"
      why: "ссылка на стандарт — не реестровый номер"
    - kind: clause-chain
      text: "пп. 4/5-1 и 7/2-3 Правил страхования"
      why: "короткие цепочки пунктов: меньше групп, нет «-н», нет года"
    - kind: date-slash
      text: "срок действия 12/2024-06/2025"
      why: "диапазон месяцев: нет буквенной группы, две группы-даты"
