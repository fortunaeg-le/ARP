# Файл-описание типа (фабрика типов). Правится ТОЛЬКО здесь;
# entity_types.yaml собирает tests/corpus_v2/assemble_types.py.
type: REG_ID
title: Регистрационный номер в реестре (9 цифр)
status: active
detect:
  form:
    class: digit_run
    params: {digits: 9}
  # ТОЛЬКО якорный тип: у голых 9 цифр нет ни КС, ни формы — без слова
  # «реестр*/регистрационн*» слева значение не берётся вовсе (правило этапов
  # 3/4, ENTITY_SPEC §3.4). Якорь — шлагбаум, не сигнал (validate нет).
  anchor: '(?i)реестр\w*|регистрац\w*'
  token_prefix: REGID
  rank: 650
  sets: [personal_requisites, with_money]
  measure: {leak_class: numeric}
generator:
  provenance: >-
    черновик 2 владельца, позиция В1(б)5 («регистрационный номер в реестре,
    9 цифр»)
  weave:
    intro: 'Запись о лицензии внесена в реестр за регистрационным номером '
    outro: '.'
    neg_intro: 'Внутренний учёт ведётся отдельно: '
  examples:
    - "144625873"
    - "509118266"
    - "731004592"
    - "268530417"
    - "895217304"
  negatives:
    - kind: inventory
      text: "инвентарный номер 123456789"
      why: "чужая номенклатура: без слова «реестр» рядом 9 цифр не берутся"
    - kind: order-number
      text: "номер заявки 987654321"
      why: "номер заявки — не запись реестра; якоря нет"
    - kind: registry-no-number
      text: "сведения внесены в реестр, номер записи не присвоен"
      why: "слово-якорь есть, значения нет — маскировать нечего"
