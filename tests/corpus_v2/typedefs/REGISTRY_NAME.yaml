# Файл-описание типа (фабрика типов). Правится ТОЛЬКО здесь;
# entity_types.yaml собирает tests/corpus_v2/assemble_types.py.
type: REGISTRY_NAME
title: Регистрирующий орган (налоговая инспекция)
status: active
detect:
  # РАЗДЕЛЕНИЕ, ЗАДАННОЕ ВЛАДЕЛЬЦЕМ (позиция В2(г)): маскируется орган С
  # НОМЕРОМ ИЛИ КОНКРЕТИКОЙ — он сужает район регистрации стороны; РОДОВОЕ
  # упоминание реестра («сведения в ЕГРЮЛ», «Единый государственный реестр
  # юридических лиц») не раскрывает ничего и остаётся негативом. Поэтому
  # голых «ЕГРЮЛ/ЕГРИП/ЕГРН» в формах НЕТ — и это решение, а не пропуск.
  patterns:
    # ТЕРРИТОРИАЛЬНЫЙ ХВОСТ обрывается на запятой, точке с запятой, переносе и
    # ТОЧКЕ — но точка после сокращения («г.», «обл.», «гор.», «окр.»,
    # «респ.») хвост НЕ рвёт: правило записано взглядом назад, по закрытому
    # списку сокращений. Без него живой замер обрезал спан ровно на «по г»,
    # а город («Москве») оставался открытым — недобор границы это утечка.
    #
    # 1) Инспекция С НОМЕРОМ: «Межрайонная ИФНС России № 46 по г. Москве».
    - form:
        class: raw
        pattern: '(?i)(?:межрайонн\w+\s+)?(?:инспекци\w+\s+|управлени\w+\s+)?(?:ми?фнс|уфнс|ифнс|фнс)\s*(?:росси\w+\s*)?№\s?\d{1,3}(?:\s+по\s+(?:[^\n,;.]|(?<=\bг)\.|(?<=\bобл)\.|(?<=\bгор)\.|(?<=\bокр)\.|(?<=\bресп)\.){1,45})?'
    # 2) Инспекция/управление С ТЕРРИТОРИЕЙ: «УФНС России по Республике
    #    Татарстан».
    - form:
        class: raw
        pattern: '(?i)(?:межрайонн\w+\s+)?(?:инспекци\w+\s+|управлени\w+\s+)?(?:ми?фнс|уфнс|ифнс|фнс)\s+(?:росси\w+\s+)?по\s+(?:[^\n,;.]|(?<=\bг)\.|(?<=\bобл)\.|(?<=\bгор)\.|(?<=\bокр)\.|(?<=\bресп)\.){1,45}'
  token_prefix: REGORG
  rank: 970
  sets: [personal_requisites, with_money]
  measure: {leak_class: text}
generator:
  provenance: >-
    ИЗ ПРАКТИКИ ОФОРМЛЕНИЯ ДОГОВОРОВ, ЖИВЫМ ДОКУМЕНТОМ НЕ ПОДТВЕРЖДЕНО.
    Позиция В2(г) черновика владельца («названия реестров и госорганов:
    ЕГРЮЛ, ЕГРИП, налоговые инспекции с номерами») названа, формулировок
    владельца по ней нет: формы наименований инспекций взяты из общей
    практики регистрационных сведений. На реальном документе этапа TYPES-2
    маскируемая ветвь не встретилась ни разу (встретилось только родовое
    «ЕГРЮЛ» — негатив по этому же файлу).
  weave:
    intro: 'Запись о государственной регистрации внесена регистрирующим органом: '
    outro: '.'
    neg_intro: 'Общие сведения о регистрации: '
  examples:
    - "Межрайонная ИФНС России № 46 по г. Москве"
    - "МИФНС России № 15 по Санкт-Петербургу"
    - "ИФНС России по г. Наро-Фоминску Московской области"
    - "УФНС России по Республике Татарстан"
    - "Инспекция ФНС России № 24 по г. Москве"
  negatives:
    - kind: bare-registry
      text: "сведения о юридическом лице содержатся в ЕГРЮЛ"
      why: "родовое упоминание реестра: ЕГРЮЛ один на всю страну и не сужает круг — решение владельца «родовое не маскируем»"
    - kind: registry-full-name
      text: "выписка из Единого государственного реестра юридических лиц"
      why: "то же родовое упоминание полным именем — маскировать нечего"
    - kind: tax-authority-generic
      text: "отчётность представляется в налоговый орган по месту учёта"
      why: "орган без имени, номера и территории — не раскрывает район регистрации"
    - kind: other-registry-generic
      text: "предприниматель зарегистрирован, запись внесена в ЕГРИП"
      why: "родовое упоминание второго реестра: тот же случай, что ЕГРЮЛ"
