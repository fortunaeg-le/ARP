# Файл-описание типа (фабрика типов). Правится ТОЛЬКО здесь;
# entity_types.yaml собирает tests/corpus_v2/assemble_types.py.
type: CONTRACT_NO
title: Номер договора
status: active
detect:
  form:
    class: raw
    # Якорь «договор/соглашение/контракт … №/номер» встроен в паттерн, спан —
    # ТОЛЬКО сам номер (span_group=1, приём «детектируем ПО якорю, маскируем
    # БЕЗ якоря», как у СНИЛС). Дата «от 15.03.2024» в спан НЕ входит: дата
    # документа — отдельная сущность (в v2 сегодня негатив DATE), затягивать
    # её под чужую маску нельзя. <=2 разделителя внутри номера разводят его с
    # формульным REG_NUMBER (там >=4 групп и «-н»).
    # Номер может начинаться и с букв («СУБ-44/2023»), но обязан содержать
    # цифру (lookahead) — «Договор № б/н» номером не считается.
    # (?!\d{11}) — прогон из 11+ цифр номером договора не бывает: это чужой
    # реквизит (счёт/ИНН), его должен брать его собственный тип, а не хвост
    # якоря «договор … №» (замер v2 ловил 20-значные счета-проформы).
    pattern: '(?i)(?:договор\w*|соглашени\w*|контракт\w*)[^\n\d№n]{0,25}(?:№|номер\w*|\bn\b)\s*((?!\d{11})(?=[0-9а-яёa-z/-]{0,25}\d)[0-9а-яёa-z][0-9а-яёa-z/-]{0,24}[0-9а-яёa-z]|[0-9]{1,2}(?!\d))'
  span_group: 1
  token_prefix: CONTRACT
  rank: 960
  sets: [with_money]
  measure: {leak_class: numeric}
generator:
  provenance: >-
    черновик 2 владельца, позиция В2(б)4 («договор + порядковый номер
    (+ от гггг)»)
  weave:
    intro: 'Работы выполняются на основании ранее заключённого Договора № '
    outro: ' между теми же сторонами.'
    neg_intro: 'Первичные документы: '
  examples:
    - "118/2024-А"
    - "2/17"
    - "01Ф-00034/16-124Д"
    - "СУБ-44/2023"
    - "17595/001-сс"
  negatives:
    - kind: invoice
      text: "счёт-фактура выставлена без ссылки на номер"
      why: "счёт-фактура — не договор; номера нет вовсе"
    - kind: license-doc
      text: "лицензия Л035-01298-77/00123456 Рособрнадзора"
      why: "номер чужого документа: слова «договор» рядом нет"
    - kind: bare-clause
      text: "как указано в пункте 4.2 настоящего Договора"
      why: "«договор» рядом с номером ПУНКТА: номер пункта — отрицательный класс CLAUSE_REF, не номер договора"
