#
# ЗАПРЕТ 6 СНЯТ ВЛАДЕЛЬЦЕМ 2026-08-08 (сессия TYPE-FACTORY-2): черновик
# составлен по конкретной документации — условие сторожа («формулировки
# владельца из живых договоров») исполнено. Решение владельца:
#   * ИМЕННАЯ ветвь (транш «Имя») — МАСКИРУЕТСЯ (этот файл);
#   * ПОРЯДКОВАЯ («1-й транш») и описательные обороты — НЕ маскируются,
#     размечены негативами kind=ordinal-tranche (values.py tranche()).
type: TRANCHE
title: Транш (именной)
status: active
detect:
  form:
    class: raw
    # Слово «транш*» + имя в кавычках (« », " ", „ “). Числа в имени владелец
    # не давал — страж validate.py «TRANCHE с числом = ошибка» остаётся.
    pattern: '(?i)транш\w*\s*[«"„][^»"“\n]{1,60}[»"“]'
  token_prefix: TRANCHE
  rank: 1450
  sets: [with_money]
  measure: {leak_class: text}
generator:
  provenance: >-
    черновик 2 владельца, позиция В3(б)2 («[транш] + [именной], пр-р: транш
    "Со-единения"»); форма — владельца, имена траншей синтетические (как ФИО
    и названия фирм в остальном корпусе)
  weave:
    intro: 'Финансирование предоставляется частями; первым выбирается '
    outro: ' согласно графику выборки.'
    neg_intro: 'Порядок дальнейшей выборки: '
    only_ctypes: [loan, cession]
  examples:
    - text: "транш «Со-единения»"
      form: "TRANCHE|оборот=именной: транш «Имя»"
      axes: {"оборот": "именной: транш «Имя»"}
    - text: "транш «Развитие»"
      form: "TRANCHE|оборот=именной: транш «Имя»"
      axes: {"оборот": "именной: транш «Имя»"}
    - text: "транш «Северная очередь»"
      form: "TRANCHE|оборот=именной: транш «Имя»"
      axes: {"оборот": "именной: транш «Имя»"}
    - text: "транш «Оборотный»"
      form: "TRANCHE|оборот=именной: транш «Имя»"
      axes: {"оборот": "именной: транш «Имя»"}
    - text: "транш «Модернизация цеха»"
      form: "TRANCHE|оборот=именной: транш «Имя»"
      axes: {"оборот": "именной: транш «Имя»"}
  negatives:
    - kind: ordinal-tranche
      text: "1-й транш перечисляется после подписания"
      why: "порядковый транш не маскируется — решение владельца (TYPE-FACTORY-2)"
    - kind: generic-plural
      text: "график выдачи траншей согласовывается дополнительно"
      why: "родовое упоминание без имени — маскировать нечего"
    - kind: named-no-tranche
      text: "программа «Со-единение» благотворительного фонда"
      why: "имя в кавычках без слова «транш» — чужая сущность (название), не транш"
