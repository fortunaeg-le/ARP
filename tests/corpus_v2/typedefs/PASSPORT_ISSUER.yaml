# Файл-описание типа (фабрика типов). Правится ТОЛЬКО здесь;
# entity_types.yaml собирает tests/corpus_v2/assemble_types.py.
type: PASSPORT_ISSUER
title: Орган выдачи паспорта
status: active
detect:
  form:
    class: raw
    # Приём «детектируем ПО якорю, маскируем БЕЗ якоря» (как СНИЛС и
    # CONTRACT_NO): слово «выдан*» обязано стоять слева, но в спан (group 1)
    # входит ТОЛЬКО орган. Орган опознаётся ЗАКРЫТЫМ списком маркеров
    # (УФМС/МВД/ОВД/ПВС/отдел внутренних дел/…): без маркера «выдана
    # доверенность», «выдана лицензия» и прочие «выдан» не берутся вовсе.
    #
    # ХВОСТ БЕЗ ЦИФР — это граница с соседними типами, а не украшение.
    # Справа от органа стоит ДАТА ВЫДАЧИ (тип DATE) и КОД ПОДРАЗДЕЛЕНИЯ
    # (тип DEPT_CODE, этап 3): затянуть их под чужую маску нельзя — каждый
    # реквизит маскируется своим типом, иначе восстановление вернёт чужую
    # форму. Цифры разрешены только в ГОЛОВЕ (до маркера): «ТП № 2 ОУФМС…»
    # — номер территориального пункта часть имени органа.
    #
    # КРАЙ СПРАВА — ЧЕТЫРЕ ТЕРМИНАТОРА, И НИ ОДНОГО «ДО КОНЦА СТРОКИ»:
    # запятая/точка с запятой, цифра (дата выдачи), слова «код подразделен*»,
    # конец строки — плюс ТОЧКА, но ТОЛЬКО в конце строки. Точка внутри строки
    # терминатором не является намеренно: «по г. Москве» и «Московской обл.»
    # — сокращения ВНУТРИ имени органа, и точка после «г» оборвала бы город
    # (проверено: без этого правила спан кончался на «по г»).
    pattern: '(?i)выдан\w*\s*[:\-—]?\s*((?:[^\n]{0,30}?)(?:УФМС|ФМС|МВД|УВД|ОВД|ПВС|ГУВД|отделом?\s+внутренних\s+дел|отделени\w*\s+по\s+вопросам\s+миграции|паспортн\w*\s+стол\w*)[^\n\d]{0,60}?)(?=\s*(?:[,;]|\d|код\s+подразделен|\n|$)|\s*\.\s*(?:\n|$))'
  span_group: 1
  token_prefix: ISSUER
  rank: 810
  # НАБОР ПО УМОЛЧАНИЮ («Только персональные данные») ВКЛЮЧЁН САНКЦИЕЙ
  # ВЛАДЕЛЬЦА (этап MERGE-2, 2026-08-09): «это прямые ПДн — орган выдачи
  # плюс дата сужают круг не хуже номера паспорта». До этого тип стоял
  # только в наборах `personal_requisites`/`with_money`, потому что состав
  # набора по умолчанию заперт стражем
  # (tests/test_type_factory.py::test_type_policy_sets_match_config —
  # строгое равенство с PERSONAL_DEFAULT) и новый тип не входит в набор
  # юриста молча. Парная строка — src/type_policy.py::PERSONAL_DEFAULT.
  sets: [personal, personal_requisites, with_money]
  measure: {leak_class: text}
generator:
  provenance: >-
    ИЗ ПРАКТИКИ ОФОРМЛЕНИЯ ДОГОВОРОВ, ЖИВЫМ ДОКУМЕНТОМ НЕ ПОДТВЕРЖДЕНО.
    Позиция В1(б)6.3 черновика владельца («кем выдан паспорт») названа, но
    формулировок владельца по ней нет: формы органов выдачи взяты из общей
    практики паспортных реквизитов (УФМС/МВД/ОВД). Урок паспорта: живая форма
    записи бывает такой, какую не угадать, — при появлении живого образца
    форму пересматривать.
  weave:
    intro: 'Паспорт гражданина Российской Федерации выдан '
    outro: ', паспорт предъявлен при подписании.'
    neg_intro: 'Сопутствующие сведения: '
  examples:
    - "ГУ МВД России по г. Москве"
    - "ОУФМС России по Тверской области в Заволжском р-не"
    - "ТП № 2 ОУФМС России по Московской обл."
    - "УМВД России по Владимирской области"
    - "Отделом внутренних дел «Тропарёво» г. Москвы"
    - "Отделением по вопросам миграции ОМВД России по Кировскому району"
  negatives:
    - kind: licence-issuer
      text: "лицензия выдана Федеральной службой по надзору в сфере образования"
      why: "«выдан» есть, но орган не паспортный: ни одного маркера закрытого списка — выдающий орган лицензии не реквизит человека"
    - kind: power-of-attorney
      text: "доверенность выдана сроком на три года без права передоверия"
      why: "«выдана» без органа вовсе — маскировать нечего"
    - kind: police-mention-no-issue
      text: "заявление подано в ОВД по месту жительства заявителя"
      why: "маркер органа есть, слова «выдан» слева нет — якорь обязателен, упоминание отдела не реквизит паспорта"
    - kind: bare-issued
      text: "паспорт выдан, реквизиты приведены в приложении"
      why: "якорь есть, органа нет — пустое срабатывание должно быть невозможно"
