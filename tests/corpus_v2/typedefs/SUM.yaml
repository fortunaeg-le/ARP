# Файл-описание типа (фабрика типов, сессия 2). Правится ТОЛЬКО здесь;
# entity_types.yaml собирает tests/corpus_v2/assemble_types.py.
type: SUM
title: Денежная сумма
status: active
detect:
  patterns:
    # КЛАСС К4 «число + слово закрытого списка» (ЭТАП FIX-3): у каждого куска
    # формы появилось ИМЯ — где число, где пропись, где единица. Перевод с
    # сырого паттерна проверен ПОСИМВОЛЬНО.
    - form:
        class: number_with_unit
        params:
          number: '\d[\d  ]*+'
          decimals: '([.,]\d+)?'
          # составная форма «893 000 (восемьсот девяносто три тысячи) рублей»
          parenthetical: '(?:\s?\([^)\n\d]{1,120}\))?'
          gap: '\s?'
          units: '(руб(лей|ля|\.)?|₽|USD|\$|долл(аров|\.)?)'
          # хвост копеек: класс [пробел+NBSP], не \s (урок A2-NEWLINE-CROSS)
          suffix: '(?:[  ]\d{2}[  ]коп(?:еек|ейки|\.)?)?'
          right_boundary: '(?![а-яА-ЯёЁ])'
    # ВТОРАЯ ВЕТВЬ — ЧИСТО СЛОВЕСНАЯ СУММА (ЭТАП FIX-3, долг
    # SUMWORDS-DEFERRED; решение владельца: словесные суммы бьются ровно как
    # численные, одна сумма = один токен).
    # ПОЧЕМУ ВЕТВЬ ТИПА, А НЕ НОВЫЙ ТИП: эталон корпуса v2 размечает такие
    # вхождения тем же видом данных MONEY (ось «пропись=вместо цифр», 52
    # эталона). Отдельный тип дал бы cross-type на каждом из них — то есть
    # правильную маску, посчитанную ошибкой.
    # ЧИСЛИТЕЛЬНЫЕ — ЗАКРЫТЫЙ ГРАММАТИЧЕСКИЙ КЛАСС: перечислены КОРНИ, а не
    # значения. Понимать число не нужно — нужно найти ГРАНИЦЫ, поэтому
    # обязательна валюта справа: без неё «в течение трёх лет», «двое суток»
    # и «пятьдесят процентов» отсекаются самой формой, а не списком запретов.
    # Разделители — пробел/NBSP/дефис, НЕ \s (урок A2-NEWLINE-CROSS).
    - form:
        class: raw
        pattern: '(?i)(?<![-а-яё])(?:ноль|один\w*|одна|одну|полтор\w+|дв[ае]|двух|тр[иеё]х?|четыр\w+|пят\w+|шест\w+|сем\w+|восем\w+|восьм\w+|девят\w+|десят\w+|одиннадцат\w*|двенадцат\w*|тринадцат\w*|четырнадцат\w*|пятнадцат\w*|шестнадцат\w*|семнадцат\w*|восемнадцат\w*|девятнадцат\w*|двадцат\w*|тридцат\w*|сорок\w*|девяност\w*|ст[оа]|двест[иа]|трист\w*|четырест\w*|тысяч\w*|миллион\w*|миллиард\w*)(?:[  -]+(?:ноль|один\w*|одна|одну|полтор\w+|дв[ае]|двух|тр[иеё]х?|четыр\w+|пят\w+|шест\w+|сем\w+|восем\w+|восьм\w+|девят\w+|десят\w+|одиннадцат\w*|двенадцат\w*|тринадцат\w*|четырнадцат\w*|пятнадцат\w*|шестнадцат\w*|семнадцат\w*|восемнадцат\w*|девятнадцат\w*|двадцат\w*|тридцат\w*|сорок\w*|девяност\w*|ст[оа]|двест[иа]|трист\w*|четырест\w*|тысяч\w*|миллион\w*|миллиард\w*)){0,6}[  ]+(?:рубл\w+|копе\w+|долл\w+)(?:[  ]+\d{1,2}[  ]+копе\w+)?(?![а-яё])'
  token_prefix: 'SUM'
  rank: 1000
  sets: [with_money]
  measure: {leak_class: numeric}
generator: legacy
notes: |
  ЭТАП FIX-3 — вторая ветвь: чисто словесная сумма (см. комментарий у
  паттерна). Замер до правки: 52 эталона v2, ни один не находился.

  ЭТАП A7 — `(?i)` (долг TGOLDA-SUM-CASE). Слово валюты было единственным
  регистрозависимым куском во всём реестре: «732 589,00 РУБ.» (шапка
  таблицы или спецификация целиком прописными — обычная вёрстка) не
  матчилось ВОВСЕ, miss_reason: nothing, тогда как остальные типы давно
  смотрят на detection_text. Правка не добавляет ни одной новой ФОРМЫ
  значения — тот же класс слов валюты, снят только регистр; правая граница
  (?![а-яА-ЯёЁ]) была регистро-независимой изначально, поэтому «5 РУБАШЕК»
  не берётся ни до, ни после.
