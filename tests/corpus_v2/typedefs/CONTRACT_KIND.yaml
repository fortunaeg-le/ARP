# Файл-описание типа (фабрика типов). Правится ТОЛЬКО здесь;
# entity_types.yaml собирает tests/corpus_v2/assemble_types.py.
type: CONTRACT_KIND
title: Вид договора
status: active
detect:
  # ЭТО НЕ ПЕРСОНАЛЬНЫЕ ДАННЫЕ, а конфиденциальность сделки (формулировка
  # владельца, позиция В2(б)1-3). Отсюда наборы: тип живёт в «Сделке с
  # деньгами» и в «Максимуме», а в наборе «Только персональные данные»
  # (по умолчанию у юриста) его нет.
  #
  # СТОЛКНОВЕНИЕ С CONTRACT_NO РАЗВЕДЕНО ФОРМОЙ, не арбитражем: там спан —
  # только НОМЕР после «№», здесь — только слова ВИДА, «№» в форму не
  # входит. «Договор поставки № 118/2024-А» даёт две непересекающиеся маски.
  patterns:
    # 1) «договор/соглашение/контракт» + вид в родительном падеже.
    - form:
        class: raw
        pattern: '(?i)(?:договор\w*|соглашени\w*|контракт\w*)\s+(?:возмездного\s+оказания\s+услуг|оказания\s+услуг|поставки|подряда|субподряда|аренды|субаренды|займа|цессии|купли-продажи|мены|дарения|уступки\s+прав\w*(?:\s+требования)?|комиссии|поручения|хранения|перевозки|лизинга|страхования|коммерческой\s+концессии)'
    # 2) вид прилагательным перед словом «договор».
    - form:
        class: raw
        pattern: '(?i)(?:лицензионн|агентск|субагентск|абонентск|трудов|концессионн|учредительн|рамочн)\w*\s+договор\w*'
  token_prefix: CTKIND
  rank: 965
  sets: [with_money]
  sets_why: >-
    вид договора не персональные данные — он не относится к человеку и не
    сужает круг лиц; он раскрывает СУТЬ СДЕЛКИ, поэтому входит в набор
    «Сделка с деньгами» и в «Максимум», но не в набор «Только персональные
    данные».
  measure: {leak_class: text}
generator:
  provenance: >-
    ИЗ ПРАКТИКИ ОФОРМЛЕНИЯ ДОГОВОРОВ, ЖИВЫМ ДОКУМЕНТОМ НЕ ПОДТВЕРЖДЕНО.
    Позиция В2(б)1-3 черновика владельца («вид договора») названа, живых
    формулировок владельца по ней нет: перечень видов взят из общей практики
    заголовков и отсылок («договор поставки», «лицензионный договор»).
    ПЕРЕПИСЬ ДО ЗАВЕДЕНИЯ (этап TYPES-2): на корпусе v1 форма встречается
    332 раза, из них в эталоне v1 — 0, в негативах v1 — 0, в ignore — 0;
    то есть столкновения определений, как у CONTRACT_NO (315 срабатываний
    ровно на негативах v1), здесь НЕТ — v1 про вид договора не высказан
    вовсе, и рост числа масок на v1 идёт по неразмеченной прозе.
  weave:
    intro: 'Стороны ранее заключили '
    outro: ' на сопоставимых условиях.'
    neg_intro: 'Прочие условия: '
  examples:
    - "договор возмездного оказания услуг"
    - "договор поставки"
    - "лицензионный договор"
    - "договор подряда"
    - "агентский договор"
    - "договор уступки права требования"
  negatives:
    - kind: generic-contract-word
      text: "настоящий Договор вступает в силу с момента подписания"
      why: "слово «договор» без вида — родовое упоминание, сути сделки не раскрывает"
    - kind: contract-number
      text: "реквизиты первичных документов приведены в приложении"
      why: "номер договора — чужой тип CONTRACT_NO со своим спаном; вид здесь не назван"
    - kind: kind-word-standalone
      text: "поставка товара осуществляется партиями по заявкам"
      why: "слово вида без слова «договор»: это условие исполнения, а не название сделки"
    - kind: law-reference
      text: "отношения сторон регулируются гражданским законодательством"
      why: "отсылка к закону без вида договора — маскировать нечего"
