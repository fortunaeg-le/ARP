# Файл-описание типа (фабрика типов, сессия 2). Правится ТОЛЬКО здесь;
# entity_types.yaml собирает tests/corpus_v2/assemble_types.py.
type: OGRN
title: ОГРН / ОГРНИП
status: active
detect:
  form:
    class: digit_run
    params: {digits: 13, optional_extra: 2}
  validate: 'ogrn_checksum'
  anchor: '(?i)огрн'
  anti_anchor: '(?i)\bштрих\s*-?\s*код\w*|\bean\b|\bокпо\b|\bоктмо\b|\bокато\b|\bоквэд\b|\bокуд\b|\bкбк\b|код\w*\s+бюджетн\w*|\bинвентарн\w*|\bартикул\w*|\bуин\b'
  token_prefix: 'OGRN'
  rank: 200
  sets: [personal_requisites, with_money]
  measure: {leak_class: numeric}
generator: legacy
notes: |
  ЭТАП A7 — АНТИ-ЯКОРЬ ЧУЖИХ НОМЕНКЛАТУР (долги Stage4-C, A3-NEG-OGRN,
  A5-INN-KBK-FP). Контрольная сумма как ЕДИНСТВЕННОЕ основание ненадёжна по
  арифметике, а не по реализации: на произвольном числе нужной длины она
  сходится с вероятностью 1/10 (ИНН-10), 1/11 (ОГРН-13), 1/13 (ОГРНИП-15) —
  замерено, а не выведено (штрихкод EAN-13: 18 из 138; ОКПО: 19 из 138).
  Ограничителей поставлено ДВА, и оба не трогают якорную дорогу:
  * здесь — имя ЧУЖОЙ НОМЕНКЛАТУРЫ рядом (штрихкод/ОКПО/КБК/ОКТМО/…);
  это не список конкретных негативов, а класс: число, ВВЕДЁННОЕ именем
  другой системы учёта, реквизитом стороны не является ни при какой КС;
  * в src/regex_detector.py — `_digit_run_neighbour`: значение, вырезанное
  из более длинного прогона цифр, КС не подтверждается.
  Анти-якорь действует ТОЛЬКО на значение без якоря (см. detect_regex): под
  словом «ИНН»/«ОГРН» инвариант этапа 4 сильнее — там КС уже не решает.
