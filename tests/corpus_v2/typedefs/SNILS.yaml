# Файл-описание типа (фабрика типов, сессия 2). Правится ТОЛЬКО здесь;
# entity_types.yaml собирает tests/corpus_v2/assemble_types.py.
type: SNILS
title: СНИЛС
status: active
detect:
  form:
    class: raw
    pattern: '(?i)(?:снилс|страхов\w*\s+свидетельств\w*(?:\s+(?:государственного|обязательного)\s+пенсионного\s+страхования)?)[^\n\d]{0,30}(\d{3}[- ]?\d{3}[- ]?\d{3}[- ]?\d{2})(?!\d)'
  span_group: 1
  token_prefix: 'SNILS'
  rank: 600
  sets: [personal, personal_requisites, with_money]
  measure: {leak_class: numeric}
generator: legacy
notes: |
  без контекстного якоря ("паспорт"/"серия") этот паттерн матчил бы любое 10-значное число —
  у паспортных данных нет контрольной суммы, поэтому единственная защита от ложных срабатываний — якорь по контексту
  ЭТАП 3 — СНИЛС. Форма ddd-ddd-ddd dd; после нормализации этапа 2 разделители
  между цифрами схлопнуты, поэтому они опциональны. Детекция ПО ЯКОРЮ «СНИЛС»,
  маскируется span_group=1 (значение без якоря).
  ЧЕК-СУММА НАМЕРЕННО НЕ ВЕШАЕТСЯ как validate. У СНИЛС она есть, но инвариант
  этапа 4 (STATE §4): номер с не сошедшейся КС — ВСЁ РАВНО ПДн, отбраковка = утечка.
  В корпусе есть SNILS с checksum:invalid, и они обязаны маскироваться. Якорь
  «СНИЛС» + форма — достаточное и не отбраковывающее основание; validate: здесь
  означало бы «увидели и выбросили», т.е. заранее воспроизвело бы дыру этапа 4.
  ЭТАП A2 — тот же класс, что был у паспорта до A1 (A1-RIGID-GAP-SURVEY):
  официальное название документа длиннее, чем «страховое свидетельство» —
  практика оформления пишет «...государственного/обязательного пенсионного
  страхования» между якорем и номером; это добавлено В ЯКОРЬ (опционально),
  а не в зазор — иначе якорь перестал бы быть якорем на 50+ символов.
  Зазор {0,20} -> {0,30} (остаток — «(СНИЛС) № », «: » и т.п.); разделитель
  групп цифр `[- ]?` НЕ трогаем на bare `\s?` — попытка дала регресс
  BIRTHDATE (см. комментарий там, A2-NEWLINE-CROSS): `\s` матчит и
  ПАРАГРАФНЫЙ перенос, который в тексте документа — не пробел внутри
  значения, а граница сегмента/ячейки; итог — разорванный частичный матч
  вместо чистого пропуска. Оставлено дефис/пробел, как было.
