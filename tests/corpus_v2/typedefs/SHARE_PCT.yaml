# Файл-описание типа (фабрика типов). Правится ТОЛЬКО здесь;
# entity_types.yaml собирает tests/corpus_v2/assemble_types.py.
type: SHARE_PCT
title: Доля голосов / доля участия
status: active
detect:
  form:
    class: raw
    # Число + %/процент + ОБЯЗАТЕЛЬНОЕ основание доли (голоса / уставный
    # капитал): без основания это обычный PERCENT, и два типа спорили бы за
    # каждый «18%» (tail_required — решение владельца, §8 п.3 дизайна).
    # rank 1390 < PERCENT(1400): при равной длине прав более специфичный тип;
    # обычно же спан SHARE_PCT просто длиннее и побеждает по rule 2.
    pattern: '(?i)(?<![\d.,])\d(?:[ ]?\d){0,2}(?:[.,]\d{1,2})?\s?(?:%|процент\w*)\s+(?:голос\w*(?:\s+от\s+общего\s+числа)?|(?:долей\s+)?(?:в\s+)?уставн\w+\s+капитал\w*|акци\w+)'
  token_prefix: SHARE
  rank: 1390
  sets: [with_money]
  measure: {leak_class: text}
generator:
  provenance: >-
    черновик 2 владельца, позиции В1(в)2 («доля [число + %]») и В1(г)1
    («доля голосов, например в голосовании совета директоров»)
  weave:
    intro: 'Решение принято большинством в '
    outro: ' от общего числа голосов членов совета директоров.'
    neg_intro: 'Кворум определяется уставом: '
  examples:
    - "75 % голосов"
    - "40 % уставного капитала"
    - "25,5 % голосов от общего числа"
    - "51 % акций"
    - "9 % уставного капитала общества"
  negatives:
    - kind: quorum-no-number
      text: "большинством голосов присутствующих участников"
      why: "нет числа — маскировать нечего"
    - kind: fraction-words
      text: "большинством в две трети голосов"
      why: "дробно-словесная форма — СЕМ, правилами не берётся (ENTITY_SPEC §3.5); честный негатив, а не молчаливый пропуск"
    - kind: defect-share
      text: "доля брака не превышает 1 % партии"
      why: "техническая доля: основания «голоса/капитал» нет, SHARE её не берёт (а PERCENT отсечён своим анти-якорем «брак»)"
