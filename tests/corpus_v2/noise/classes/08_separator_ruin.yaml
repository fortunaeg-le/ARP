id: separator_ruin
title: Сломан разделитель даты или суммы
evidence: inferred
why: |
  Точка, запятая, двоеточие и дефис занимают несколько пикселей. На них
  приходится бОльшая доля ошибок, чем на буквы, и ошибка обычно взаимная:
  точка читается как запятая, дефис — как тире или как точка, точка в дате —
  как пробел (клякса «съела» знак вместе с зазором). Пользовательская дата
  «2()23» пришла именно из такого документа — значит, разделители в нём тоже
  под ударом.
targets: [any]
scope: value
op: sep_swap
params:
  mode: one
  map:
    ".": [",", " ", ":", "-"]
    ",": [".", " "]
    "-": ["—", ".", "–"]
    "/": ["\\", "|", "7"]
    ":": [".", ";"]
hits: |
  DATE и BIRTHDATE («12,03.2024», «12 03 2024»), MONEY (копейки: «1 500.00»
  против «1 500,00»), PHONE, ACCOUNT с дефисами, DOCNUM («№ 12/24» -> «№ 12\\24»).
examples:
  - in: "01.03.2024"
    out: "01,03.2024"
  - in: "№ 17/2024"
    out: "№ 17\\2024"
