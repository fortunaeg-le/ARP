# Класс искажения распознавания. Правится ТОЛЬКО здесь; корпус порождает
# tests/corpus_v2/generate_noise.py, руками в noise/docs не лазить.
id: paren_zero
title: Ноль распался на скобочную пару
evidence: observed-user
seen: |
  Договор, вытащенный из PDF чужим распознаванием, принесён владельцем
  2026-08-18: дата «2()23», сумма «500 ()()()». Сам документ никуда не
  положен (запрет 7) — воспроизводится КЛАСС, не текст.
why: |
  Овал нуля в сканах низкого разрешения и в тонких шрифтах рвётся по бокам на
  две дуги. Посимвольный классификатор видит две отдельные вертикальные дуги и
  выдаёт наиболее похожую пару глифов — круглые скобки. Ширина при этом
  сохраняется, поэтому иногда между дугами остаётся пробел: «( )».
targets: [digits]
scope: value
op: char_map
params:
  map:
    "0": ["()", "( )", "()"]
  max_hits: 4
hits: |
  Все цифровые виды: DATE, MONEY, PERCENT, TERM, INN, KPP, OGRN, ACCOUNT, BIK,
  SNILS, PASSPORT, PHONE, DOCNUM. Бьёт сильнее прочих по реквизитам с нулями
  в середине (счёт, ОГРН) и по круглым суммам, где нулей подряд четыре и более.
examples:
  - in: "2023"
    out: "2()23"
  - in: "500 000"
    out: "500 ()()()"
