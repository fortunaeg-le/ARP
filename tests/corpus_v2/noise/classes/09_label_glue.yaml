id: label_glue
title: Подпись склеилась со значением
evidence: inferred
why: |
  Тот же порог зазора, что у `space_loss`, но по границе «слово — число».
  В шапке и в таблице реквизитов подпись набрана вплотную к значению
  («ИНН 7712345678» в узкой колонке), и пробел теряется. Класс выделен
  ОТДЕЛЬНО от `space_loss`, потому что бьёт по другому месту: не по величине,
  а по ЛЕВОМУ КОНТЕКСТУ, за который цепляется детекция реквизитов.
targets: [any]
scope: context
op: label_glue
hits: |
  Все виды, чья детекция опирается на подпись слева: INN, KPP, OGRN, BIK,
  ACCOUNT, SNILS, DOCNUM, TERM. Значение при этом ЦЕЛОЕ — эталонный спан
  не меняется ни на символ, меняется только то, что слева от него.
examples:
  - in: "ИНН 7712345678"
    out: "ИНН7712345678"
