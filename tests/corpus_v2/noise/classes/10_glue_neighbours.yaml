id: glue_neighbours
title: Соседние значения склеились в одно
evidence: inferred
why: |
  Реквизиты в договоре стоят в таблице без видимых границ. Если распознавание
  не нашло линий ячеек (их и нет — рамка выключена), содержимое соседних ячеек
  выкладывается подряд, а разделителя между ними взять неоткуда. Получается
  «7712345678770101001» — ИНН и КПП, слипшиеся в двадцатизначное число, которое
  ПОХОЖЕ НА СЧЁТ.
targets: [any]
scope: context
op: glue_neighbours
hits: |
  Пары реквизитов, стоящие рядом: ИНН+КПП, ОГРН+дата, БИК+счёт, телефон+почта.
  Опасность двойная: своё вхождение не находится, а на месте склейки может
  найтись ЧУЖОЙ тип — то есть ошибка не только в полноте, но и в точности.
examples:
  - in: "ИНН 7712345678 КПП 770101001"
    out: "ИНН 7712345678770101001"
