id: char_loss
title: Символ потерян
evidence: inferred
why: |
  Тонкий штрих (единица, «i», точка), выцветшая печать, складка на скане, полоса
  от протяжки сканера — символ не находится вовсе, и распознавание отдаёт строку
  короче исходной. Это САМОЕ ТИХОЕ из искажений: результат остаётся
  правдоподобным числом, просто другим.
targets: [any]
scope: value
op: drop_char
params:
  what: digit
  keep_min: 4
hits: |
  Виды с контрольной суммой (ИНН, СНИЛС, ОГРН) — вхождение перестаёт быть
  валидным и по длине, и по сумме; MONEY — сумма меняется в десять раз и
  остаётся правдоподобной; DATE — «01.3.2024».
  Отдельно отмечу: этот класс НЕОБРАТИМ. Никакая нормализация не восстановит
  потерянную цифру — прибор нужен, чтобы знать долю таких случаев, а не чтобы
  их чинить.
examples:
  - in: "7712345678"
    out: "771234568"
  - in: "500 000"
    out: "50 000"
