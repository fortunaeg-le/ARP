id: digit_gap
title: Лишние пробелы внутри числа
evidence: inferred
why: |
  Распознавание решает вопрос «пробел или нет» по ширине зазора между глифами.
  В договорах реквизиты набирают разрежённо, а сумму — с разрядкой; при
  выключке по ширине зазоры внутри одной группы цифр становятся шире межсловных
  в соседней строке. Порог срабатывает не там, и цифровая группа рассыпается.
  Неразрывный пробел выдаётся редко, но выдаётся: он приходит не из
  распознавания, а из последующей вставки в Word.
targets: [digits]
scope: value
op: insert
params:
  what: digit
  insert: [" ", " ", " ", " "]
  max_hits: 2
hits: |
  Все цифровые виды. Опаснее прочих для ИНН/ОГРН/счёта: форма требует
  фиксированной длины подряд идущих цифр, а разрыв делит её на две короткие
  группы, ни одна из которых длины не набирает.
examples:
  - in: "7712345678"
    out: "771 23 45678"
  - in: "01.03.2024"
    out: "01.03.20 24"
