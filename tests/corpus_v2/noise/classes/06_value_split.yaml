id: value_split
title: Значение разорвано на части
evidence: inferred
why: |
  Величина не поместилась в строку или в колонку. В PDF это выглядит как две
  строки, и извлечение текста ставит между ними перевод строки; если исходная
  вёрстка переносила по слогам — остаётся дефис переноса. Отдельно: в
  двухколоночной шапке договора реквизит переносится ПОСРЕДИ ЦИФР, потому что
  колонка узкая, а число не имеет пробелов, по которым можно перенести.
targets: [any]
scope: value
op: split
params:
  mark: ["\n", "-\n", "­\n"]
hits: |
  Все виды. Тяжелее прочих для ADDRESS и PASSPORT_ISSUER (длинные, переносятся
  чаще) и для ACCOUNT (20 цифр не влезают в колонку).
  ОТЛИЧИЕ ОТ КОРПУСА V2: приём `linebreak` (generate.py:819) рвёт ровно
  посередине цифровой цепочки и только переводом строки; здесь место разрыва
  случайно и добавлены дефис переноса и мягкий перенос.
examples:
  - in: "40702810900000012345"
    out: "4070281090-\n0000012345"
  - in: "01.03.2024"
    out: "01.0\n3.2024"
