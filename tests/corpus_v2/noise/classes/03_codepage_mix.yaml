id: codepage_mix
title: Кириллица и латиница вперемешку в словах
evidence: inferred
why: |
  А/A, В/B, Е/E, К/K, М/M, Н/H, О/O, Р/P, С/C, Т/T, У/Y, Х/X — пары, у которых
  начертание совпадает ПОЛНОСТЬЮ. Распознавание выбирает кодовую страницу по
  строке, и в строке из заглавных («ООО «ВЕКТОР»», «МОСКВА») выбор часто падает
  на латиницу — визуально это заметить невозможно.
targets: [letters]
scope: value
op: char_map
params:
  map:
    "А": ["A"]
    "В": ["B"]
    "Е": ["E"]
    "К": ["K"]
    "М": ["M"]
    "Н": ["H"]
    "О": ["O"]
    "Р": ["P"]
    "С": ["C"]
    "Т": ["T"]
    "У": ["Y"]
    "Х": ["X"]
    "а": ["a"]
    "е": ["e"]
    "о": ["o"]
    "р": ["p"]
    "с": ["c"]
    "у": ["y"]
    "х": ["x"]
  max_hits: 3
hits: |
  Словесные виды: PER (ФИО), ORG, ADDRESS, PASSPORT_ISSUER, REGISTRY_NAME,
  TRANCHE, CONTRACT_KIND, а также словесные суммы («Пятьсот тысяч рублей»).
  По цифровым видам не бьёт вовсе.
examples:
  - in: "ООО «Вектор»"
    out: "OОО «Вeктор»"
  - in: "СЕРГЕЕВ"
    out: "CЕРГЕEВ"
