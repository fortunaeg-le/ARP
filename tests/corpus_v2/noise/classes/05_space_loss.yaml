id: space_loss
title: Потеря пробелов внутри величины
evidence: inferred
why: |
  Обратная сторона того же порога, что у `digit_gap`. Плотная вёрстка, мелкий
  кегль в шапке или в таблице реквизитов — и зазор между разрядами суммы
  («500 000») или между словами адреса оказывается уже порога. Разряды
  склеиваются в одно число, слова — в одно слово.
targets: [any]
scope: value
op: squeeze
params:
  drop: [" ", " ", " "]
hits: |
  MONEY (разряды), ACCOUNT и PHONE (записанные группами), ADDRESS и ORG
  (склейка слов). Для суммы последствие не в потере вхождения, а в СМЕНЕ
  ВЕЛИЧИНЫ на вид: «500 000» и «500000» читаются человеком одинаково, поэтому
  ошибка тихая.
examples:
  - in: "500 000"
    out: "500000"
  - in: "+7 (495) 123-45-67"
    out: "+7(495)123-45-67"
