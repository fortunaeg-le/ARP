id: digit_as_letter
title: Цифра прочитана как буква
evidence: inferred
why: |
  Классическая путаница посимвольного распознавания: 0/О/O, 1/l/I/І, 3/З,
  4/Ч, 5/S, 6/б, 8/В, 9/g различаются несколькими пикселями контура, а
  языковая модель распознавания в реквизитах не помогает — там нет слов.
  В русском документе выбор идёт И из кириллицы, И из латиницы, потому что
  кодовая страница выбирается по строке целиком, а не по символу.
  ОТЛИЧИЕ ОТ ТОГО, ЧТО УЖЕ ЕСТЬ В КОРПУСЕ: приём `homoglyph` корпуса v2
  (generate.py:611 homoglyph_text) ставит на место цифр ТОЛЬКО кириллические
  О/З/Ч/б/І. Здесь список шире (латиница, S/g/B) и, главное, вхождения
  размечены классом искажения, а не общим словом «омоглиф».
targets: [digits]
scope: value
op: char_map
params:
  map:
    "0": ["О", "O", "о"]
    "1": ["l", "I", "І"]
    "3": ["З", "з"]
    "4": ["Ч", "A"]
    "5": ["S", "Б"]
    "6": ["б", "G"]
    "8": ["В", "B"]
    "9": ["g", "q"]
  max_hits: 2
hits: |
  Те же цифровые виды, что и paren_zero, но особенно ИНН/КПП/ОГРН/СНИЛС:
  у них есть контрольная сумма, и буква на месте цифры выбивает вхождение
  из формы ЦЕЛИКОМ, а не портит одну позицию.
examples:
  - in: "7712345678"
    out: "77l2345б78"
  - in: "01.03.2024"
    out: "О1.03.2024"
