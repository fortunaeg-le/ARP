id: column_reorder
title: Перепутан порядок строк из колонок
evidence: inferred
why: |
  Реквизиты сторон в договоре стоят в две колонки: слева Поставщик, справа
  Покупатель. Извлечение текста из PDF идёт по координатам, и при малейшем
  расхождении базовых линий строки двух колонок чередуются: строка левой,
  строка правой, снова левой. Величины при этом ЦЕЛЫ И НЕ ТРОНУТЫ — ломается
  только принадлежность значения стороне и соседство подписи со значением.
targets: [any]
scope: context
op: column_reorder
hits: |
  Формально — ни по одному виду данных: ни один символ величины не меняется.
  Практически — по всему, что детектируется НЕ САМО ПО СЕБЕ, а по соседству:
  ФИО рядом с должностью, адрес под словом «Адрес», номер счёта после БИК.
  Класс заведён именно затем, чтобы отделить «сломано значение» от «сломан
  порядок»: лечение нормализатора на второй случай не влияет вовсе, и если
  цифра по этому классу просядет, чинить надо не нормализатор.
examples:
  - in: "Поставщик: ООО «Вектор» / ИНН 7712345678"
    out: "ИНН 7712345678 / Поставщик: ООО «Вектор»"
